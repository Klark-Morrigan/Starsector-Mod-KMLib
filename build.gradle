// KMLib's own build. The shared Starsector mod conventions live in
// gradle/starsector-mod.gradle (hosted here, since KMLib owns the Starsector
// build knowledge) and are applied below; this file keeps only what is
// specific to KMLib.
apply from: "${rootDir}/gradle/starsector-mod.gradle"

group = 'kmlib'

// LunaLib backs KmLogging's in-game log-level binding. compileOnly: KMLib
// declares no LunaLib mod dependency (it must stay usable by mods that do not
// ship LunaLib), so only callers that depend on LunaLib may invoke that code;
// the game classloader provides the jar at runtime for those that do.
// testRuntimeOnly so classes implementing LunaLib's listener interface can be
// loaded and verified under test.
def lunaLibJarFile = file("${project.ext.starsectorRoot}/mods/lunalib/jars/LunaLib.jar")

// Soft dependency: compileOnly, and KMLib declares no Console Commands mod
// dependency. Command classes load only when Console Commands reads KMLib's
// commands.csv, so a game without it never touches these classes and KMLib
// stays usable on its own. Resolved by glob since the install folder is
// version-stamped.
def consoleCommandsJars = fileTree(
        dir: "${project.ext.starsectorRoot}/mods", include: ['**/jars/lw_Console.jar'])

dependencies {
    compileOnly files(lunaLibJarFile)
    testCompileOnly files(lunaLibJarFile)
    testRuntimeOnly files(lunaLibJarFile)

    compileOnly consoleCommandsJars
    testCompileOnly consoleCommandsJars
    testRuntimeOnly consoleCommandsJars
}

jacocoTestReport {
    // The 'testing' package ships test fixtures (e.g. StarsectorSettingsFake)
    // in main so downstream mods can reuse them; they're production-located
    // but test-only, so excluding them keeps the coverage signal honest.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['kmlib/starsector/testing/**'])
        })
    )
}

// The shared lint gates are build logic, so each carries its own TestKit
// integration test: it drives a real Gradle build, so it integrates with the
// Gradle runtime rather than exercising a unit in isolation. They live in a
// dedicated 'test-gradle' tree, not the unit-test one, because gradleTestKit()
// drags a log4j-over-slf4j bridge onto the runtime classpath that would
// otherwise shadow the real log4j the logging unit tests assert against.
// Everything here stays in KMLib - the gate scripts are shared with consumer
// mods, their tests deliberately are not.
sourceSets {
    testGradle {
        // Mirror each gate's own path under src/test-gradle, grouping a test and
        // its .txt fixtures in one folder named for the script under test, with
        // the fixtures split into java/ and kotlin/ subfolders. Each folder is a
        // source root, so the test sits in the default package (a Java package
        // cannot carry the folder's hyphens) and the fixtures resolve under the
        // shared classpath root - the java//kotlin/ prefix plus distinct names
        // keep them from colliding there.
        def gateTestDirs = [
                'src/test-gradle/tasks/lint/formatting/tests/enforce-single-blank-lines',
                'src/test-gradle/tasks/lint/literals/tests/enforce-no-magic-literals-java',
                'src/test-gradle/tasks/lint/literals/tests/enforce-no-magic-literals-kotlin',
                'src/test-gradle/tasks/lint/naming/tests/enforce-suffix-on-fakes',
                'src/test-gradle/tasks/lint/naming/tests/enforce-suffix-on-mocks',
                'src/test-gradle/tasks/lint/structure/tests/enforce-tests-nested',
        ]
        java.srcDirs = gateTestDirs
        resources.srcDirs = gateTestDirs
        resources.exclude '**/*.java'
    }
}

configurations {
    // Reuse the unit-test stack (JUnit, AssertJ) without re-declaring it, while
    // keeping gradleTestKit scoped to this source set alone.
    testGradleImplementation.extendsFrom testImplementation
    testGradleRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testGradleImplementation gradleTestKit()
}

def testGradle = tasks.register('testGradle', Test) {
    description = 'Runs TestKit integration tests for the shared Gradle gates.'
    group = 'verification'
    testClassesDirs = sourceSets.testGradle.output.classesDirs
    classpath = sourceSets.testGradle.runtimeClasspath
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // Each gate script under test is a runtime input the matching test reads by
    // path, so declare it as a task input: editing a gate must re-run these
    // tests rather than leave them UP-TO-DATE against a stale version. The path
    // is also handed to the test so it does not assume a working directory.
    def fakeGateScript = file(
            'gradle/tasks/lint/naming/tests/enforce-suffix-on-fakes.gradle')
    inputs.file(fakeGateScript).withPropertyName('fakeGateScript')
    systemProperty 'gate.script.path', fakeGateScript.absolutePath

    def mockGateScript = file(
            'gradle/tasks/lint/naming/tests/enforce-suffix-on-mocks.gradle')
    inputs.file(mockGateScript).withPropertyName('mockGateScript')
    systemProperty 'mock.gate.script.path', mockGateScript.absolutePath

    def nestedGateScript = file(
            'gradle/tasks/lint/structure/tests/enforce-tests-nested.gradle')
    inputs.file(nestedGateScript).withPropertyName('nestedGateScript')
    systemProperty 'nested.gate.script.path', nestedGateScript.absolutePath

    def singleBlankGateScript = file(
            'gradle/tasks/lint/formatting/enforce-single-blank-lines.gradle')
    inputs.file(singleBlankGateScript).withPropertyName('singleBlankGateScript')
    systemProperty 'single.blank.gate.script.path', singleBlankGateScript.absolutePath

    // The literal gates also read a shared rule config by path (detekt.yml /
    // checkstyle-magic-literals.xml), so those are inputs too: editing a rule
    // must re-run the tests, not leave them UP-TO-DATE against stale rules.
    def javaLiteralsGateScript = file(
            'gradle/tasks/lint/literals/enforce-no-magic-literals-java.gradle')
    inputs.file(javaLiteralsGateScript).withPropertyName('javaLiteralsGateScript')
    inputs.file(file('gradle/checkstyle-magic-literals.xml'))
            .withPropertyName('checkstyleMagicLiteralsConfig')
    systemProperty 'java.literals.gate.script.path', javaLiteralsGateScript.absolutePath

    def kotlinLiteralsGateScript = file(
            'gradle/tasks/lint/literals/enforce-no-magic-literals-kotlin.gradle')
    inputs.file(kotlinLiteralsGateScript).withPropertyName('kotlinLiteralsGateScript')
    inputs.file(file('gradle/detekt.yml')).withPropertyName('detektConfig')
    systemProperty 'kotlin.literals.gate.script.path', kotlinLiteralsGateScript.absolutePath
}

// Run with the rest of verification: 'check' covers a local 'build', and
// 'coverage' is the task KMLib's CI invokes.
tasks.matching { it.name in ['check', 'coverage'] }.configureEach {
    dependsOn testGradle
}
