// KMLib's own build. The shared Starsector mod conventions live in
// gradle/starsector-mod.gradle (hosted here, since KMLib owns the Starsector
// build knowledge) and are applied below; this file keeps only what is
// specific to KMLib.
apply from: "${rootDir}/gradle/starsector-mod.gradle"

group = 'kmlib'

// On-demand Java formatting (`gradlew spotlessApply`). The wiring and the
// rationale live in the shared script; the only thing KMLib decides here is
// that bridgeStubs is exempt, for the same reason
// checkstyleBridgeStubs is disabled below - the stubs mirror a third party's
// shape, which is not ours to restyle.
ext.formatterExcludedSourceSets = ['bridgeStubs']
apply from: "${rootDir}/../Common-Java/gradle/spotless-java.gradle"

enforcePackageVocabulary {
    // To curb usage of non-fitting words in relation to fills.
    forbidWords under: 'kmlib', words: ['ground']
}

// LunaLib backs KmLogging's in-game log-level binding. compileOnly, and
// declared in mod_info.json so a consumer can call into kmlib.logging and
// kmlib.settings unconditionally; the game classloader provides the jar at
// runtime. testRuntimeOnly so classes implementing LunaLib's listener interface
// can be loaded and verified under test.
def lunaLibJarFile = file("${project.ext.starsectorRoot}/mods/lunalib/jars/LunaLib.jar")

// Soft dependency: compileOnly, and KMLib declares no Console Commands mod
// dependency. Command classes load only when Console Commands reads KMLib's
// commands.csv, so a game without it never touches these classes and KMLib
// stays usable on its own. Located by jar name since the install folder is
// version-stamped.
def consoleCommandsJars = findModJars('lw_Console.jar')

// LazyLib backs LazyFontCache's bitmap-font loading; the game exposes no way to draw
// text at arbitrary coordinates in a render pass. compileOnly, and declared in
// mod_info.json: absent LazyLib raises NoClassDefFoundError inside a render pass, and
// no guard can prevent it - LabelRenderer names LazyFont.TextAnchor in its own
// signature, so the class resolves before any guard runs. testRuntimeOnly so the
// class can load under test.
def lazyLibJarFile = file("${project.ext.starsectorRoot}/mods/lw_lazylib/jars/LazyLib.jar")

// LazyLib is written in Kotlin, so its types carry Kotlin-generated bytecode: an enum's static
// initialiser calls kotlin.enums.EnumEntriesKt, which lives in the Kotlin runtime LazyLib ships
// beside its own jar and declares in its mod_info. In-game the game classloader has both loaded, so
// nothing else in KMLib has to know; under test the enum fails to initialise without it, which is
// how a test that merely names a LazyFont anchor dies on NoClassDefFoundError.
//
// It is a compile input too, despite no KMLib source naming a Kotlin type. LazyFont's
// DrawableString carries Kotlin @Deprecated annotations whose level is a kotlin.DeprecationLevel
// constant, and javac reads the annotations on every member it resolves. Off the compile
// classpath the enum cannot be resolved and each one warns "unknown enum constant
// DeprecationLevel.HIDDEN" - noise that reads like a real problem and is not one.
//
// compileOnly like the other soft dependencies, so it stays out of the produced artifact.
def lazyLibKotlinRuntimeJarFile = file(
        "${project.ext.starsectorRoot}/mods/lw_lazylib/jars/internal/Kotlin-Runtime.jar")

// Random Assortment of Things backs RandomAssortmentOfThingsMatcher (and, through
// it, StarSystems' reachability read): compiling against RAT's Abyssal Fracture
// type lets a caller treat a fracture as a means of arrival. Soft dependency, the
// same stance as LunaLib/LazyLib/Console above - KMLib declares no RAT mod
// dependency, the matcher gates every use behind a mod-enabled check so a RAT-free
// install never resolves the type, and the game classloader supplies the jar at
// runtime for installs that ship it. Located by jar name since the install folder
// is version-stamped; testRuntimeOnly so the matcher's tests can load under test.
def ratJars = findModJars('RandomAssortmentofThings.jar')

// MagicLib backs CoreUiTree, the one place that reflects into the live core-UI widget tree: its
// ReflectionUtils drives the java.lang.reflect ops through method handles, the sanctioned bypass
// of the script classloader's reflection ban. Every probe that walks that tree goes through it, so
// this is a single seam rather than a per-probe dependency. compileOnly, and declared in
// mod_info.json: its absence leaves the reach throwing, which each probe answers with its own
// fail-open or fail-closed policy rather than breaking. Located by jar name since the install
// folder can vary; testRuntimeOnly so the class can load under test.
def magicLibJars = findModJars('MagicLib.jar')

// org.json backs LunaSettingsWriter's write path: LunaLib's backing store is a
// LazyLib CommonDataJSONObject, which extends org.json.JSONObject, so javac must
// resolve JSONObject#put and JSONException to compile the write. The classes ship
// in starsector-core/json.jar, provided by the game classloader at runtime, so
// compileOnly like the rest (testRuntime already sees it via starsectorCoreJars).
def jsonJarFile = file("${project.ext.starsectorRoot}/starsector-core/json.jar")

// The game's core (obfuscated) jar backs the two casts to concrete campaign classes
// the API jar does not publish: CampaignMapView's campaign-UI-data class, and the
// intel screen's EventsPanel that its visor readings come off. Reflection is not an
// option in its place: the game's script classloader denies java.lang.reflect to
// mod code outright, while loading core classes is permitted. The classes KMLib
// touches are marked DoNotObfuscate, so their names are stable across game builds.
// compileOnly: the game classloader provides the jar at runtime. This coupling
// stays in KMLib (not consumer mods) so exactly one place compiles against the
// core jar. Test runtime already sees it via the shared starsectorCoreJars set.
// fs.common_obf.jar rides along because the core classes implement its
// DoNotObfuscate marker, which javac must resolve to compile a cast to them.
def starfarerObfJarFile = file("${project.ext.starsectorRoot}/starsector-core/starfarer_obf.jar")
def fsCommonObfJarFile = file("${project.ext.starsectorRoot}/starsector-core/fs.common_obf.jar")

// Fast Rendering's bridge backs FastRenderingModelviewMatrixReader, which reads the modelview
// from the renderer's own TransformManager because GL does not hold it under that mod.
//
// It is bound differently from the soft dependencies above, because unlike LunaLib or RAT it is
// not a mod folder that a build machine can simply install: fr.jar exists only on an install that
// has been patched in place, so requiring it would make KMLib compilable only on a patched
// machine - including CI, which would then need a patched game to compile a class it never runs.
//
// So the source is the constant and the classpath is not: a patched install compiles the adapter
// against genir's actual bytes, and a stock one falls back to compile-only mirrors of the three
// members it reads (src/bridgestubs/java). Development happens on patched installs, so the strict
// binding is the everyday one and stub drift surfaces as an ordinary compile error rather than as
// a promise nobody checks; the stubs only keep an unpatched machine's build green.
//
// compileOnly either way, like the rest: the game classloader provides fr.jar at runtime on the
// installs that have it, and the stubs must never reach the jar, where they would shadow the real
// classes. Which binding was used is logged at build time, since a build that quietly varies by
// machine is worth being able to see.
//
// Two properties make each leg buildable on demand rather than only on the machine that happens to
// select it, which is what lets CI run both:
//
// -PvanillaOnly=true builds as an unpatched install would - the vanilla binding, which in practice
// means compiling against the bridge stubs. Named for the install it stands in for rather than for
// the stubs that do the standing: a caller is choosing which player's game to prove buildable, and
// the stubs are how that is arranged. Without it the vanilla leg is only ever exercised where
// nobody is watching, which is the failure the stubs are meant to prevent rather than cause.
//
// -PrequireFastRendering=true refuses to fall back, failing instead. A build that means to check
// the adapter against genir's real bytes has to be able to insist on them: silently compiling stubs
// would report success for a check that never ran, which is worse than not running it, since the
// green tells a reader the signatures were verified.
def fastRenderingJarFile = file("${project.ext.starsectorRoot}/starsector-core/fr.jar")
def isVanillaForced = findProperty('vanillaOnly') == 'true'
def isFastRenderingRequired = findProperty('requireFastRendering') == 'true'
def isFastRenderingInstalled = fastRenderingJarFile.exists() && !isVanillaForced

// Which Fast Rendering the adapter is type-checked against, read out of the jar itself:
// fr.jar carries com.genir.renderer.Version.getVersion(). The jar is the only source that
// exists everywhere the build does - a patched install is patched IN PLACE, so there is no
// mod folder to read a mod_info.json from, and CI has only the transported core jars.
//
// Loaded under a bootstrap-parented loader so the class cannot resolve against the build's
// own classpath, and closed immediately; the method returns a constant and touches nothing
// else, so nothing stays loaded. Any failure - an older jar without the class, a renamed
// method - reports 'unknown version'. Which Fast Rendering was bound is a thing to report,
// never a reason to fail a build that would otherwise compile.
def readFastRenderingVersion = { File jar ->
    if (!jar.exists()) {
        return null
    }
    try {
        def loader = new URLClassLoader([jar.toURI().toURL()] as URL[], (ClassLoader) null)
        try {
            return loader.loadClass('com.genir.renderer.Version')
                    .getMethod('getVersion')
                    .invoke(null)
        } finally {
            loader.close()
        }
    } catch (Exception ignored) {
        return null
    }
}
def fastRenderingVersion = null
if (isFastRenderingInstalled) {
    fastRenderingVersion = readFastRenderingVersion(fastRenderingJarFile) ?: 'unknown version'
}

if (isFastRenderingRequired && isVanillaForced) {
    throw new GradleException('-PrequireFastRendering and -PvanillaOnly select opposite '
            + 'bindings; pass one or neither.')
}
if (isFastRenderingRequired && !isFastRenderingInstalled) {
    throw new GradleException(
            "-PrequireFastRendering=true, but no Fast Rendering bridge at ${fastRenderingJarFile}. "
                    + 'This build machine needs a Fast-Rendering-patched Starsector install to '
                    + "verify KMLib's bridge adapter against the real jar.")
}

sourceSets {
    bridgeStubs {
        // Declared explicitly to match the path used in the repo. If undeclared,
        // Gradle derives the same path in camel case, which causes case-sensitive
        // operating systems to look in the wrong place.
        java.srcDirs = ['src/bridgestubs/java']
    }
}

// Read here, at configuration time, so the guard below touches no project state while the task
// runs, and so the failure can quote the directories Gradle ACTUALLY read rather than the ones
// the lifecycle messages below name.
def bridgeStubsSrcDirs = sourceSets.bridgeStubs.java.srcDirs.join(', ')
def hasBridgeStubSources = !sourceSets.bridgeStubs.java.files.isEmpty()

// Reported at configuration time so it prints on EVERY invocation. It used to be logged from
// compileJava's doFirst, which is silent whenever that task is up-to-date or served from the
// build cache - so the build most likely to be read after the fact, an incremental one, was
// the one that said nothing.
//
// Only when a jar is bound. The vanilla binding has no Fast Rendering to report, and naming
// the version sitting unused on the machine under a build that asked for vanilla invites the
// misreading it would exist to prevent. The generic toolchain line (Common-Java's
// java-conventions.gradle) still prints for both, since Gradle and the JVM are the same
// question either way.
if (isFastRenderingInstalled) {
    logger.lifecycle("Fast Rendering: ${fastRenderingVersion} (bound from ${fastRenderingJarFile})")
}

tasks.named('compileJava') {
    doFirst {
        // Nothing to check on the Fast Rendering binding - the jar either exists or the
        // build already failed above.
        if (isFastRenderingInstalled) {
            return
        }

        // Both remaining bindings compile against the stubs, so an empty stub source set is not
        // a degraded build - it is a broken one. sourceSets.bridgeStubs.output lands on
        // compileJava's classpath as an empty directory, and every com.genir.renderer.bridge.*
        // import then fails naming the file that imports the stubs rather than the stubs that
        // went missing. Guarded for the same reason -PrequireFastRendering refuses to fall back:
        // a binding that is silently absent has to say so itself, or the reader debugs the
        // wrong file.
        if (!hasBridgeStubSources) {
            // The parentheses around the else-branch are load-bearing. Without them the
            // ternary is a complete statement at the end of its own line, so the next
            // line's leading '+' starts a NEW statement - unary plus on a String, which
            // dies as "No signature of method: java.lang.String.positive()". Every other
            // leading-'+' continuation in this file sits inside a method call's
            // parentheses, where a newline cannot end the expression; this one did not.
            def selected = isVanillaForced
                    ? '-PvanillaOnly=true selected the vanilla binding'
                    : ("no Fast Rendering bridge at ${fastRenderingJarFile}, so the build fell "
                            + 'back to the stub binding')
            throw new GradleException("${selected}, but the bridgeStubs source set has no "
                    + "sources. Gradle read ${bridgeStubsSrcDirs}. Note that the conventional "
                    + "directory for a source set named 'bridgeStubs' is src/bridgeStubs/java, "
                    + 'which is the same path as src/bridgestubs on a case-insensitive '
                    + 'filesystem and a different one on Linux.')
        }
    }
}

// The stubs mirror a third party's signatures, so they are held to genir's shape rather than to
// KM house style - the names are not ours to choose.
tasks.named('checkstyleBridgeStubs') {
    enabled = false
}

dependencies {
    compileOnly files(lunaLibJarFile)
    testCompileOnly files(lunaLibJarFile)
    testRuntimeOnly files(lunaLibJarFile)

    compileOnly consoleCommandsJars
    testCompileOnly consoleCommandsJars
    testRuntimeOnly consoleCommandsJars

    compileOnly ratJars
    testCompileOnly ratJars
    testRuntimeOnly ratJars

    compileOnly magicLibJars
    testCompileOnly magicLibJars
    testRuntimeOnly magicLibJars

    compileOnly files(lazyLibJarFile)
    testCompileOnly files(lazyLibJarFile)
    testRuntimeOnly files(lazyLibJarFile)
    compileOnly files(lazyLibKotlinRuntimeJarFile)
    testCompileOnly files(lazyLibKotlinRuntimeJarFile)
    testRuntimeOnly files(lazyLibKotlinRuntimeJarFile)

    compileOnly files(jsonJarFile)
    testCompileOnly files(jsonJarFile)

    compileOnly files(starfarerObfJarFile)
    testCompileOnly files(starfarerObfJarFile)

    compileOnly files(fsCommonObfJarFile)
    testCompileOnly files(fsCommonObfJarFile)

    // The stubs name Matrix4f in the one signature they mirror, so they need the jar it lives in.
    bridgeStubsCompileOnly files("${project.ext.starsectorRoot}/starsector-core/lwjgl_util.jar")

    if (isFastRenderingInstalled) {
        compileOnly files(fastRenderingJarFile)
        testCompileOnly files(fastRenderingJarFile)
    } else {
        compileOnly sourceSets.bridgeStubs.output
        testCompileOnly sourceSets.bridgeStubs.output
    }
}

jacocoTestReport {
    // The 'testfixtures' package ships fakes in main so downstream mods can reuse
    // them (the jar is consumed flat, so java-test-fixtures cannot carry them);
    // they're production-located but test-only, so excluding them keeps the
    // coverage signal honest.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['kmlib/testfixtures/**'])
        })
    )
}
