// KMLib's own build. The shared Starsector mod conventions live in
// gradle/starsector-mod.gradle (hosted here, since KMLib owns the Starsector
// build knowledge) and are applied below; this file keeps only what is
// specific to KMLib.
apply from: "${rootDir}/gradle/starsector-mod.gradle"

group = 'kmlib'

// LunaLib backs KmLogging's in-game log-level binding. compileOnly: KMLib
// declares no LunaLib mod dependency (it must stay usable by mods that do not
// ship LunaLib), so only callers that depend on LunaLib may invoke that code;
// the game classloader provides the jar at runtime for those that do.
// testRuntimeOnly so classes implementing LunaLib's listener interface can be
// loaded and verified under test.
def lunaLibJarFile = file("${project.ext.starsectorRoot}/mods/lunalib/jars/LunaLib.jar")

// Soft dependency: compileOnly, and KMLib declares no Console Commands mod
// dependency. Command classes load only when Console Commands reads KMLib's
// commands.csv, so a game without it never touches these classes and KMLib
// stays usable on its own. Resolved by glob since the install folder is
// version-stamped.
def consoleCommandsJars = fileTree(
        dir: "${project.ext.starsectorRoot}/mods", include: ['**/jars/lw_Console.jar'])

// LazyLib backs LazyFontCache's bitmap-font loading (its LazyFont has no vanilla
// equivalent). compileOnly and no LazyLib mod dependency, the same soft-dep
// stance as LunaLib and Console above: LazyFontCache classloads only when a
// caller invokes it, so a mod that never draws cached text and never ships
// LazyLib never touches it, while the game classloader provides the jar at
// runtime for those that do. testRuntimeOnly so the class can load under test.
def lazyLibJarFile = file("${project.ext.starsectorRoot}/mods/lw_lazylib/jars/LazyLib.jar")

// Random Assortment of Things backs RandomAssortmentOfThingsMatcher (and, through
// it, StarSystems' reachability read): compiling against RAT's Abyssal Fracture
// type lets a caller treat a fracture as a means of arrival. Soft dependency, the
// same stance as LunaLib/LazyLib/Console above - KMLib declares no RAT mod
// dependency, the matcher gates every use behind a mod-enabled check so a RAT-free
// install never resolves the type, and the game classloader supplies the jar at
// runtime for installs that ship it. Globbed since the install folder is
// version-stamped; testRuntimeOnly so the matcher's tests can load under test.
def ratJars = fileTree(
        dir: "${project.ext.starsectorRoot}/mods", include: ['**/jars/RandomAssortmentofThings.jar'])

// org.json backs LunaSettingsWriter's write path: LunaLib's backing store is a
// LazyLib CommonDataJSONObject, which extends org.json.JSONObject, so javac must
// resolve JSONObject#put and JSONException to compile the write. The classes ship
// in starsector-core/json.jar, provided by the game classloader at runtime, so
// compileOnly like the rest (testRuntime already sees it via starsectorCoreJars).
def jsonJarFile = file("${project.ext.starsectorRoot}/starsector-core/json.jar")

// The game's core (obfuscated) jar backs CampaignMapView's cast to the concrete
// campaign-UI-data class, which the API jar does not publish. Reflection is not an
// option in its place: the game's script classloader denies java.lang.reflect to
// mod code outright, while loading core classes is permitted. The classes KMLib
// touches are marked DoNotObfuscate, so their names are stable across game builds.
// compileOnly: the game classloader provides the jar at runtime. This coupling
// stays in KMLib (not consumer mods) so exactly one place compiles against the
// core jar. Test runtime already sees it via the shared starsectorCoreJars set.
// fs.common_obf.jar rides along because the core classes implement its
// DoNotObfuscate marker, which javac must resolve to compile a cast to them.
def starfarerObfJarFile = file("${project.ext.starsectorRoot}/starsector-core/starfarer_obf.jar")
def fsCommonObfJarFile = file("${project.ext.starsectorRoot}/starsector-core/fs.common_obf.jar")

// Fast Rendering's bridge backs FastRenderingModelviewMatrixReader, which reads the modelview
// from the renderer's own TransformManager because GL does not hold it under that mod.
//
// It is bound differently from the soft dependencies above, because unlike LunaLib or RAT it is
// not a mod folder that a build machine can simply install: fr.jar exists only on an install that
// has been patched in place, so requiring it would make KMLib compilable only on a patched
// machine - including CI, which would then need a patched game to compile a class it never runs.
//
// So the source is the constant and the classpath is not: a patched install compiles the adapter
// against genir's actual bytes, and a stock one falls back to compile-only mirrors of the three
// members it reads (src/bridgestubs/java). Development happens on patched installs, so the strict
// binding is the everyday one and stub drift surfaces as an ordinary compile error rather than as
// a promise nobody checks; the stubs only keep an unpatched machine's build green.
//
// compileOnly either way, like the rest: the game classloader provides fr.jar at runtime on the
// installs that have it, and the stubs must never reach the jar, where they would shadow the real
// classes. Which binding was used is logged at build time, since a build that quietly varies by
// machine is worth being able to see.
//
// Two properties make each leg buildable on demand rather than only on the machine that happens to
// select it, which is what lets CI run both:
//
// -PbridgeStubsOnly=true forces the fallback, so the leg an unpatched machine takes can be built on
// a patched one. Without it that leg is only ever exercised where nobody is watching, which is the
// failure the stubs are meant to prevent rather than cause.
//
// -PrequireFastRendering=true refuses to fall back, failing instead. A build that means to check
// the adapter against genir's real bytes has to be able to insist on them: silently compiling stubs
// would report success for a check that never ran, which is worse than not running it, since the
// green tells a reader the signatures were verified.
def fastRenderingJarFile = file("${project.ext.starsectorRoot}/starsector-core/fr.jar")
def isBridgeStubsForced = findProperty('bridgeStubsOnly') == 'true'
def isFastRenderingRequired = findProperty('requireFastRendering') == 'true'
def isFastRenderingInstalled = fastRenderingJarFile.exists() && !isBridgeStubsForced

if (isFastRenderingRequired && isBridgeStubsForced) {
    throw new GradleException('-PrequireFastRendering and -PbridgeStubsOnly select opposite '
            + 'bindings; pass one or neither.')
}
if (isFastRenderingRequired && !isFastRenderingInstalled) {
    throw new GradleException(
            "-PrequireFastRendering=true, but no Fast Rendering bridge at ${fastRenderingJarFile}. "
                    + 'This build machine needs a Fast-Rendering-patched Starsector install to '
                    + "verify KMLib's bridge adapter against the real jar.")
}

sourceSets {
    bridgeStubs
}

tasks.named('compileJava') {
    doFirst {
        if (isFastRenderingInstalled) {
            logger.lifecycle("Fast Rendering bridge: compiling against ${fastRenderingJarFile}")
        } else if (isBridgeStubsForced) {
            logger.lifecycle('Fast Rendering bridge: compiling against src/bridgestubs/java '
                    + '(forced by -PbridgeStubsOnly)')
        } else {
            logger.lifecycle('Fast Rendering bridge: no fr.jar on this install, compiling against '
                    + 'src/bridgestubs/java (stub drift is unverified on this machine)')
        }
    }
}

// The stubs mirror a third party's signatures, so they are held to genir's shape rather than to
// KM house style - the names are not ours to choose.
tasks.named('checkstyleBridgeStubs') {
    enabled = false
}

dependencies {
    compileOnly files(lunaLibJarFile)
    testCompileOnly files(lunaLibJarFile)
    testRuntimeOnly files(lunaLibJarFile)

    compileOnly consoleCommandsJars
    testCompileOnly consoleCommandsJars
    testRuntimeOnly consoleCommandsJars

    compileOnly ratJars
    testCompileOnly ratJars
    testRuntimeOnly ratJars

    compileOnly files(lazyLibJarFile)
    testCompileOnly files(lazyLibJarFile)
    testRuntimeOnly files(lazyLibJarFile)

    compileOnly files(jsonJarFile)
    testCompileOnly files(jsonJarFile)

    compileOnly files(starfarerObfJarFile)
    testCompileOnly files(starfarerObfJarFile)

    compileOnly files(fsCommonObfJarFile)
    testCompileOnly files(fsCommonObfJarFile)

    // The stubs name Matrix4f in the one signature they mirror, so they need the jar it lives in.
    bridgeStubsCompileOnly files("${project.ext.starsectorRoot}/starsector-core/lwjgl_util.jar")

    if (isFastRenderingInstalled) {
        compileOnly files(fastRenderingJarFile)
        testCompileOnly files(fastRenderingJarFile)
    } else {
        compileOnly sourceSets.bridgeStubs.output
        testCompileOnly sourceSets.bridgeStubs.output
    }
}

jacocoTestReport {
    // The 'testing' package ships test fixtures (e.g. StarsectorSettingsFake)
    // in main so downstream mods can reuse them; they're production-located
    // but test-only, so excluding them keeps the coverage signal honest.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['kmlib/starsector/testing/**'])
        })
    )
}
