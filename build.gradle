// KMLib's own build. The shared Starsector mod conventions live in
// gradle/starsector-mod.gradle (hosted here, since KMLib owns the Starsector
// build knowledge) and are applied below; this file keeps only what is
// specific to KMLib.
apply from: "${rootDir}/gradle/starsector-mod.gradle"

group = 'kmlib'

jacocoTestReport {
    // The 'testing' package ships test fixtures (e.g. StarsectorSettingsFake)
    // in main so downstream mods can reuse them; they're production-located
    // but test-only, so excluding them keeps the coverage signal honest.
    classDirectories.setFrom(
        files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['kmlib/starsector/testing/**'])
        })
    )
}
