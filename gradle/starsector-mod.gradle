// Starsector-specific build conventions, shared by any mod that applies this
// script (KMLib, KMU, KMO, ...). Layered on top of Common-Java's generic JVM
// conventions: this script applies that base first, then adds only what a
// Starsector mod needs - the game's API jars on the compile/test classpath,
// mod_info.json as the version source, and the jar output location the
// launcher expects.
//
// Owned by KMLib (not Common-Java) because all of this is Starsector
// knowledge; it is build-time only and is not part of the shipped KMLib.jar.
// Applied by path, the same sibling-checkout convention used elsewhere: KMLib
// and Common-Java sit side by side under the same parent directory.

apply from: "${rootDir}/../Common-Java/gradle/java-conventions.gradle"

import groovy.json.JsonSlurper

// The knowledge-graph tool writes a generated wiki and report as markdown
// under graphify-out/. Those are derived from the source tree rather than
// authored beside it, so the doc-link gate must not judge their links. Every
// KM mod runs the tool, and Common-Java knows nothing of it, so the exclusion
// is declared here - the Starsector layer - rather than in the gate itself.
docLinkScanExcludedDirectoryNames << 'graphify-out'

// Mod metadata is the single source of truth for the artifact version, so
// the jar name and Starsector's mod listing cannot drift.
def modInfoFile = file('mod_info.json')
def modInfo = new JsonSlurper().parse(modInfoFile)

if (!modInfo.version) {
    throw new GradleException("Missing version in ${modInfoFile}")
}

version = modInfo.version

// Resolve the Starsector install root. Order: explicit override, environment
// variable, then the conventional "two levels above the mod folder" (mods
// live at <starsector>/mods/<modId>) for in-place checkouts.
def configuredStarsectorRoot = findProperty('starsectorRoot')
    ?: System.getenv('STARSECTOR_HOME')
    ?: new File(projectDir, '../..').canonicalPath

def apiJarFile = file("${configuredStarsectorRoot}/starsector-core/starfarer.api.jar")
// lwjgl_util.jar carries Vector2f / Vector3f, which appear in Misc's
// getDistance overloads. javac needs the class file on the classpath to
// resolve overload candidates, so it is compileOnly (the game classloader
// provides it at runtime, like the API jar). Harmless for mods that do not
// touch LWJGL types.
def lwjglUtilJarFile = file("${configuredStarsectorRoot}/starsector-core/lwjgl_util.jar")
// lwjgl.jar carries org.lwjgl.opengl.GL11, the raw OpenGL surface mods use to
// draw on the campaign/combat views. compileOnly like the rest: the game
// classloader always provides LWJGL at runtime. Shared here (not per-mod)
// since more than one KM mod renders raw GL.
def lwjglJarFile = file("${configuredStarsectorRoot}/starsector-core/lwjgl.jar")
// log4j backs Global.getLogger(...), the logging channel every Starsector mod
// uses. compileOnly for the same reason as the API jar: the game classloader
// provides it at runtime. Shared here (not per-mod) since all KM mods log.
def log4jJarFile = file("${configuredStarsectorRoot}/starsector-core/log4j-1.2.9.jar")
def starsectorCoreJars = fileTree(
    dir: "${configuredStarsectorRoot}/starsector-core",
    include: ['*.jar'])

// Expose the resolved root and core jars so a consumer can locate its own
// extra dependencies (Console Commands, LunaLib, KMLib, ...) without
// re-deriving the install path.
ext.starsectorRoot = configuredStarsectorRoot
ext.apiJarFile = apiJarFile
ext.starsectorCoreJars = starsectorCoreJars

// Locate a dependency mod's jar without spelling out its folder name, which is
// version-stamped for several mods (Nexerelin-0.12.0a, ...). Looks exactly one
// level down - <mods>/<anyModFolder>/jars/<jarName>, the layout the launcher
// requires - rather than matching a recursive '**/jars/<jarName>' pattern.
//
// The depth matters for build time, not just tidiness: Gradle re-walks a
// filtered file tree every time it snapshots it and never caches the result, so
// a recursive tree over mods/ is re-scanned once per glob per task that carries
// it on a classpath. A modded install holds ~175k files there, which costs
// seconds each time and turns an up-to-date build into a minute of pure
// input-checking. A directory listing plus one stat per mod folder is free by
// comparison, and the resulting FileCollection holds plain files, which Gradle
// does cache.
//
// Returns a FileCollection (empty when the mod is absent) so callers can hand it
// straight to a dependency declaration and still ask '.files.isEmpty()' when they
// want to fail the build with an "install this mod" message.
ext.findModJars = { String jarName ->
    def modFolders = file("${configuredStarsectorRoot}/mods").listFiles() ?: new File[0]
    return files(modFolders
        .collect { modFolder -> new File(modFolder, "jars/${jarName}") }
        .findAll { candidateJar -> candidateJar.isFile() })
}

// Deliberately no KMLib lookup here, though this is where a consumer's other
// mod jars are resolved from. Every mod applying this script also applies it
// BY PATH from a KMLib checkout, so that checkout is already a hard
// prerequisite; a consumer includes it as a build (settings.gradle) and names
// KMLib by its coordinates instead. Locating an installed jar as well would
// offer a second, weaker answer to a question the checkout already settles -
// and let a build compile against a release that no longer matches the
// conventions it is being built with.

// Which KMLib a consumer COMPILES against is the checkout beside it; which one
// a player INSTALLS is whatever its mod_info.json asks for. Nothing ties those
// two together on its own, so the two manifests are the one place the gap is
// visible before release rather than after it, in someone's game.
//
// Reported, never enforced. The thing that actually decides a mismatch is the
// player's launcher, which reads both manifests itself and needs no help from
// a build to do it; failing here would only stop a mod compiling because of a
// number in a JSON file, and a KMLib version bump would take every consumer's
// CI red until someone edited it. So this says what it sees and gets out of
// the way.
//
// What the launcher does with the same pair, since that is what a player will
// report: Starsector compares version segments by string EQUALITY, never by
// ordering - a declared version is not a floor, so "newer than declared" is a
// mismatch exactly like "older" is. For a 0.x mod its parser folds the leading
// "0.<minor>" into what it calls the major, so a minor bump reaches the player
// as "Error: this mod requires a different version of a mod that you have
// installed" and blocks the mod, while a patch bump only warns and still
// enables. The two messages below name which of those a mismatch will become.
//
// The script locates its own checkout rather than restating the relative path
// a consumer already spells in its `apply from`: this file sits at
// <KMLib>/gradle/, so its grandparent is the KMLib whose classes are being
// compiled against, and there is no second copy of the path to keep in step.
// The version-file task at the bottom of this file locates its script the same
// way.
def kmlibModId = 'kmlib'
def kmlibCheckoutDirectory = buildscript.sourceFile.parentFile.parentFile
def kmlibModInfoFile = new File(kmlibCheckoutDirectory, 'mod_info.json')

// Segments compare as text, so no numeric parse is wanted here: a version may
// carry a letter (Starsector mods ship versions like 0.12.2b) and equality has
// to survive it. Padded to three so 1.2 and 1.2.0 read as the same version.
def readVersionSegments = { String version ->
    def segments = version.tokenize('.')
    return (0..2).collect { index -> index < segments.size() ? segments[index] : '0' }
}

// Skipped for two shapes that have nothing to compare: KMLib's own build, which
// cannot depend on itself, and the ports, which apply these conventions for the
// API classpath without depending on KMLib at all.
def declaredKmlibDependency = modInfo.dependencies?.find { it.id == kmlibModId }
if (modInfo.id != kmlibModId && declaredKmlibDependency != null) {
    def builtKmlibVersion = new JsonSlurper().parse(kmlibModInfoFile).version

    // A dependency declared without a version is Starsector's supported way to
    // say "any release", and it is left to stand. Warned about rather than
    // accepted in silence: it also switches the launcher's own check off, so a
    // player carrying a KMLib without these classes gets no word of it either.
    if (!declaredKmlibDependency.version) {
        logger.warn("Warning: ${modInfo.id} declares ${kmlibModId} with no version while " +
            "compiling against KMLib ${builtKmlibVersion}. Neither this build nor the " +
            "launcher will tell a player when their KMLib is too old for it.")
    } else {
        def declaredSegments = readVersionSegments(declaredKmlibDependency.version)
        def builtSegments = readVersionSegments(builtKmlibVersion)

        if (declaredSegments[0] != builtSegments[0] || declaredSegments[1] != builtSegments[1]) {
            logger.warn("Warning: ${modInfo.id} compiles against KMLib " +
                "${builtKmlibVersion} but declares ${kmlibModId} " +
                "${declaredKmlibDependency.version}. The launcher blocks a mod outright " +
                "on a mismatch this size, so a player would not be able to enable " +
                "${modInfo.id} at all.")
        } else if (declaredSegments[2] != builtSegments[2]) {
            logger.warn("Warning: ${modInfo.id} compiles against KMLib " +
                "${builtKmlibVersion} but declares ${kmlibModId} " +
                "${declaredKmlibDependency.version}. A patch carries no contract change, " +
                "so this still links; the launcher shows the player a version warning.")
        }
    }
}

dependencies {
    // Starsector ships the API in starsector-core. compileOnly because the
    // game classloader already provides it at runtime - and so do mods that
    // depend on KMLib - so the jar stays out of the produced artifact.
    compileOnly files(apiJarFile)
    compileOnly files(lwjglUtilJarFile)
    compileOnly files(lwjglJarFile)
    compileOnly files(log4jJarFile)

    testCompileOnly files(apiJarFile)
    testCompileOnly files(lwjglUtilJarFile)
    testCompileOnly files(lwjglJarFile)
    testCompileOnly files(log4jJarFile)
    testRuntimeOnly files(apiJarFile)
    testRuntimeOnly starsectorCoreJars
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        if (!apiJarFile.exists()) {
            throw new GradleException(
                "Could not find starfarer.api.jar at ${apiJarFile}. " +
                "Set STARSECTOR_HOME or pass -PstarsectorRoot=<path>.")
        }
    }
}

// Starsector picks up jars listed in mod_info.json's "jars" array from this
// folder, so the build output goes straight where the launcher (and mods
// that depend on this one) expect to find it.
jar {
    archiveFileName = "${project.name}.jar"
    destinationDirectory = file("$projectDir/jars")
}

// VersionChecker reads <mod-id>.version, and nothing commits a file under that
// name: the committed copy carries a .template suffix, because a checkout used as
// a dev install is symlinked into mods/ and a committed file under the bare name
// would hand the checker quoted tokens where it expects numbers. So something has
// to fill the template locally, and the build is that something. It runs the very
// script the release pipeline runs, so the version a dev install reports and the
// version a published zip carries cannot come out differently.
def versionFileName = "${modInfo.id}.version"
def versionFileTemplateName = "${versionFileName}.template"

// Committing the template IS the opt-in to publishing update information, so it is
// also what decides whether this mod gets the local fill. Most mods applying these
// conventions publish none, and a task registered for them would declare a
// template they do not have as a task input - a build failure over a file whose
// absence is the intended state.
if (file(versionFileTemplateName).isFile()) {

    // Located from this file rather than from the consumer's own root, since only
    // the KMLib checkout holds the script and every other consumer would otherwise
    // have to restate an absolute path into it. Forward slashes because the path
    // is handed to bash, which reads a Windows backslash as an escape.
    def fillVersionFileScriptPath = new File(kmlibCheckoutDirectory,
        '.github/actions/fill-version-file-template/scripts/fill_version_file_template.sh')
        .absolutePath
        .replace('\\', '/')

    // The zip name composed the way the release pipeline composes it,
    // <jar-basename>-<version>.zip: the jar is named after the project and the
    // version comes from mod_info.json. Restated here only in the sense that both
    // sides read the same two values - it feeds the download URL, which a locally
    // generated file should point at the same asset a release would publish.
    def releaseZipName = "${project.name}-${project.version}.zip"

    // <owner>/<repo>, the shape the Actions runtime exports as GITHUB_REPOSITORY
    // and the script requires. Read from the checkout's own origin remote rather
    // than stated in a build file, so a local build cannot name a repository this
    // clone does not push to.
    def originRemoteUrl = providers.exec {
        commandLine 'git', 'remote', 'get-url', 'origin'
        workingDir projectDir
    }.standardOutput.asText

    // Split on both separators so either remote shape yields the same answer:
    // https://host/owner/repo(.git) and git@host:owner/repo(.git) differ only in
    // what separates the host from the owner, and the repository is the last two
    // segments either way.
    def releaseRepository = originRemoteUrl.map { remoteUrl ->

        def urlWithoutGitSuffix = remoteUrl.trim().replaceFirst(/\.git$/, '')
        def segments = urlWithoutGitSuffix.split('[/:]')

        if (segments.length < 2) {
            throw new GradleException("Cannot read <owner>/<repo> out of the origin remote "
                + "'${urlWithoutGitSuffix}', so ${versionFileName} cannot state a download URL.")
        }
        return "${segments[-2]}/${segments[-1]}".toString()
    }

    // The script is bash, and on Windows the shell that both exists on a
    // development machine and sees the same filesystem as the checkout is Git's.
    // Located from git itself rather than by asking PATH for 'bash', which on a
    // machine with WSL installed resolves to the WSL launcher, whose paths are not
    // these. Resolved when the task runs rather than while the build configures,
    // so a machine without Git Bash still runs every other task.
    def resolveBashExecutablePath = {

        if (!System.getProperty('os.name').toLowerCase().startsWith('windows')) {
            return 'bash'
        }

        def bashRelativePaths = ['bin/bash.exe', 'usr/bin/bash.exe']

        def gitExecutable = (System.getenv('PATH') ?: '')
            .split(File.pathSeparator)
            .collect { pathEntry -> new File(pathEntry, 'git.exe') }
            .find { candidate -> candidate.isFile() }

        if (gitExecutable == null) {
            throw new GradleException("Cannot generate ${versionFileName}: no git.exe on PATH to "
                + 'locate Git Bash from. Install Git for Windows, or run '
                + "${fillVersionFileScriptPath} under a bash of your own.")
        }

        // Which directory under the install PATH offers git from varies - <git>/cmd
        // on a plain Windows shell, <git>/mingw64/bin under Git Bash itself - so the
        // shell is searched for by walking up from wherever git was found rather
        // than by assuming a fixed hop count. Both bash locations the installer lays
        // down are tried at each level.
        def searchDirectory = gitExecutable.parentFile
        def bashExecutable = null

        while (searchDirectory != null && bashExecutable == null) {

            bashExecutable = bashRelativePaths
                .collect { relativePath -> new File(searchDirectory, relativePath) }
                .find { candidate -> candidate.isFile() }

            searchDirectory = searchDirectory.parentFile
        }
        if (bashExecutable == null) {
            throw new GradleException("Cannot generate ${versionFileName}: found git at "
                + "${gitExecutable} but no ${bashRelativePaths.join(' or ')} above it, so this "
                + 'Git ships no bash.')
        }
        return bashExecutable.absolutePath
    }

    def writeVersionFileTask = tasks.register('writeVersionFile', Exec) {

        group = 'build'

        // Parenthesised because without them the assignment is a complete statement
        // at the end of its line, and the next line's leading '+' becomes unary plus
        // on a String.
        description = ("Fills ${versionFileName} from ${versionFileTemplateName}, so a checkout "
            + 'used as a dev install reports its version to VersionChecker.')

        // The script reads mod_info.json and the template from its mod-root
        // argument, which defaults to the working directory, and resolves the output
        // path from where the caller stands. Standing in the project directory is
        // what makes the plain names below - no mod-root argument, an output path of
        // one filename - land on the consumer's own checkout.
        workingDir projectDir

        inputs.file "${projectDir}/mod_info.json"
        inputs.file "${projectDir}/${versionFileTemplateName}"
        inputs.file fillVersionFileScriptPath

        // As much an input as the files are: the remote is baked into the generated
        // download URL, so a re-pointed clone has to regenerate rather than keep a
        // URL aimed at the repository it used to push to.
        inputs.property 'releaseRepository', releaseRepository
        outputs.file "${projectDir}/${versionFileName}"

        // Set here rather than at configuration time so locating Git Bash - which
        // can fail - happens only for a build that actually generates the file.
        doFirst {
            commandLine resolveBashExecutablePath(),
                fillVersionFileScriptPath,
                versionFileName,
                releaseZipName
            environment 'GITHUB_REPOSITORY', releaseRepository.get()
        }
    }

    // Hung off jar rather than off the assemble lifecycle above it, because
    // refreshing a dev install is what `gradlew jar` IS: a checkout symlinked into
    // mods/ picks up the new jar the moment that task writes it, and a version file
    // left behind then reports the version the install no longer has - the very
    // disagreement generating it locally exists to prevent. assemble would be the
    // tidier owner of "produce what this project ships" and reach neither of the two
    // commands that actually refresh an install.
    //
    // It puts the task on the release runner too, since packaging runs `gradlew jar`
    // there. Harmless: that runner already has the bash and jq the release's own
    // version-file step needs, and the dist payload is assembled from named files,
    // so a generated file at the checkout root cannot reach the zip. The release's
    // copies come from the action, as before.
    tasks.named('jar') {
        dependsOn writeVersionFileTask
    }
}
