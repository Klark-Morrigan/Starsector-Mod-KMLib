// Starsector-specific build conventions, shared by any mod that applies this
// script (KMLib, KMU, KMO, ...). Layered on top of Common-Java's generic JVM
// conventions: this script applies that base first, then adds only what a
// Starsector mod needs - the game's API jars on the compile/test classpath,
// mod_info.json as the version source, and the jar output location the
// launcher expects.
//
// Conventions only: every line here is something a KM mod is held to, not
// something it may call. The lookups a build uses to find an install, a core
// jar or a mod jar live in starsector-install-locator.gradle, applied below so
// a consumer still gets both from this one `apply from`.
//
// Owned by KMLib (not Common-Java) because all of this is Starsector
// knowledge; it is build-time only and is not part of the shipped KMLib.jar.
// Applied by path, the same sibling-checkout convention used elsewhere: KMLib
// and Common-Java sit side by side under the same parent directory.

apply from: "${rootDir}/../Common-Java/gradle/java-conventions.gradle"

import groovy.json.JsonSlurper

// Resolved relative to THIS script's own gradle/ dir, so a consumer's own
// `apply from` path is not restated here.
apply from: new File(buildscript.sourceFile.parentFile, 'starsector-install-locator.gradle')

// The knowledge-graph tool writes a generated wiki and report as markdown
// under graphify-out/. Those are derived from the source tree rather than
// authored beside it, so the doc-link gate must not judge their links. Every
// KM mod runs the tool, and Common-Java knows nothing of it, so the exclusion
// is declared here - the Starsector layer - rather than in the gate itself.
docLinkScanExcludedDirectoryNames << 'graphify-out'

// The blocks a mod's imports are sorted into, in the order they appear: the
// game's own API, then the KM libraries and mods, then third-party jars a mod
// may compile against, then the JDK. Declared here - the Starsector layer -
// because every name in it is either the game or a mod: Common-Java lints Java
// for whoever asks and has no business knowing that Starsector, LunaLib or any
// KM mod exists.
//
// The family is listed one mod per group rather than as a single pattern, since
// a mod importing a KM library keeps that library's imports in a block of their
// own. A new mod is added here, once, for every consumer of this script - and it
// has to be: an import matching no group is sorted after every named one, which
// puts a mod's own package below java.* until someone works out why.
def starsectorImportGroups = 'com.fs.starfarer,kmlib,kmo,kmp,kmu,/^(org|lunalib)\\./,java'

checkstyle.configProperties.importGroups = starsectorImportGroups
checkstyle.configProperties.staticImportGroups = starsectorImportGroups

// Mod metadata is the single source of truth for the artifact version, so
// the jar name and Starsector's mod listing cannot drift.
def modInfoFile = file('mod_info.json')
def modInfo = new JsonSlurper().parse(modInfoFile)

if (!modInfo.version) {
    throw new GradleException("Missing version in ${modInfoFile}")
}

version = modInfo.version

// The jars every KM mod compiles against, captured as locals so the closures
// below close over the files rather than re-reading a dynamic project property.
def apiJarFile = project.ext.apiJarFile
// lwjgl_util.jar carries Vector2f / Vector3f, which appear in Misc's
// getDistance overloads. javac needs the class file on the classpath to
// resolve overload candidates, so it is compileOnly (the game classloader
// provides it at runtime, like the API jar). Harmless for mods that do not
// touch LWJGL types.
def lwjglUtilJarFile = resolveCoreJarFile('lwjgl_util.jar')
// lwjgl.jar carries org.lwjgl.opengl.GL11, the raw OpenGL surface mods use to
// draw on the campaign/combat views. compileOnly like the rest: the game
// classloader always provides LWJGL at runtime. Shared here (not per-mod)
// since more than one KM mod renders raw GL.
def lwjglJarFile = resolveCoreJarFile('lwjgl.jar')
// log4j backs Global.getLogger(...), the logging channel every Starsector mod
// uses. compileOnly for the same reason as the API jar: the game classloader
// provides it at runtime. Shared here (not per-mod) since all KM mods log.
def log4jJarFile = resolveCoreJarFile('log4j-1.2.9.jar')
def starsectorCoreJars = project.ext.starsectorCoreJars

dependencies {
    // Starsector ships the API in starsector-core. compileOnly because the
    // game classloader already provides it at runtime - and so do mods that
    // depend on KMLib - so the jar stays out of the produced artifact.
    compileOnly files(apiJarFile)
    compileOnly files(lwjglUtilJarFile)
    compileOnly files(lwjglJarFile)
    compileOnly files(log4jJarFile)

    testCompileOnly files(apiJarFile)
    testCompileOnly files(lwjglUtilJarFile)
    testCompileOnly files(lwjglJarFile)
    testCompileOnly files(log4jJarFile)
    testRuntimeOnly files(apiJarFile)
    testRuntimeOnly starsectorCoreJars
}

// A mod publishing test fixtures builds them against the same game jars its own
// tests compile against: a fixture poses vanilla types, so without these it can
// only pose the mod's own. Guarded on the plugin, since a mod with nothing to
// share declares no fixtures source set and those configurations do not exist.
plugins.withId('java-test-fixtures') {
    dependencies {
        testFixturesCompileOnly files(apiJarFile)
        testFixturesCompileOnly files(lwjglUtilJarFile)
        testFixturesCompileOnly files(lwjglJarFile)
        testFixturesCompileOnly files(log4jJarFile)
    }
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        if (!apiJarFile.exists()) {
            throw new GradleException(
                "Could not find starfarer.api.jar at ${apiJarFile}. " +
                "Set STARSECTOR_HOME or pass -PstarsectorRoot=<path>.")
        }
    }
}

// Starsector picks up jars listed in mod_info.json's "jars" array from this
// folder, so the build output goes straight where the launcher (and mods
// that depend on this one) expect to find it.
jar {
    archiveFileName = "${project.name}.jar"
    destinationDirectory = file("$projectDir/jars")
}

// Per-concern task scripts, each self-contained enough to read on its own: the
// manifest-pair report a consumer gets warned by, and the local fill of its
// VersionChecker template (registered only for a mod that commits one). Kept out
// of this file so it stays what its header claims - classpath, version source and
// jar location - and resolved relative to THIS script's own gradle/ dir, the same
// sibling-checkout convention Common-Java's lint tasks use.
def starsectorTasksDir = new File(buildscript.sourceFile.parentFile, 'tasks')
apply from: new File(starsectorTasksDir, 'checks/report-kmlib-version-mismatch.gradle')
apply from: new File(starsectorTasksDir, 'release/write-version-file.gradle')
