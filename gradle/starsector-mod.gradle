// Starsector-specific build conventions, shared by any mod that applies this
// script (KMLib, KMU, KMO, ...). Layered on top of Common-Java's generic JVM
// conventions: this script applies that base first, then adds only what a
// Starsector mod needs - the game's API jars on the compile/test classpath,
// mod_info.json as the version source, and the jar output location the
// launcher expects.
//
// Conventions only: every line here is something a KM mod is held to. Two of
// them are published as helpers (dependOnGameJars / dependOnModJars) because a
// rule about which configurations a jar lands on is better applied than
// restated. The lookups a build uses to find an install, a core jar or a mod
// jar live in starsector-install-locator.gradle, applied below so a consumer
// still gets both from this one `apply from`.
//
// Owned by KMLib (not Common-Java) because all of this is Starsector
// knowledge; it is build-time only and is not part of the shipped KMLib.jar.
// Applied by path, the same sibling-checkout convention used elsewhere: KMLib
// and Common-Java sit side by side under the same parent directory.

apply from: "${rootDir}/../Common-Java/gradle/java-conventions.gradle"

import groovy.json.JsonSlurper

// Resolved relative to THIS script's own gradle/ dir, so a consumer's own
// `apply from` path is not restated here.
apply from: new File(buildscript.sourceFile.parentFile, 'starsector-install-locator.gradle')

// The knowledge-graph tool writes a generated wiki and report as markdown
// under graphify-out/. Those are derived from the source tree rather than
// authored beside it, so the doc-link gate must not judge their links. Every
// KM mod runs the tool, and Common-Java knows nothing of it, so the exclusion
// is declared here - the Starsector layer - rather than in the gate itself.
docLinkScanExcludedDirectoryNames << 'graphify-out'

// The blocks a mod's imports are sorted into, in the order they appear: the
// game's own API, then the KM libraries and mods, then third-party jars a mod
// may compile against, then the JDK. Declared here - the Starsector layer -
// because every name in it is either the game or a mod: Common-Java lints Java
// for whoever asks and has no business knowing that Starsector, LunaLib or any
// KM mod exists.
//
// The family is listed one mod per group rather than as a single pattern, since
// a mod importing a KM library keeps that library's imports in a block of their
// own. A new mod is added here, once, for every consumer of this script - and it
// has to be: an import matching no group is sorted after every named one, which
// puts a mod's own package below java.* until someone works out why.
def starsectorImportGroups = 'com.fs.starfarer,kmlib,kmo,kmp,kmu,/^(org|lunalib)\\./,java'

checkstyle.configProperties.importGroups = starsectorImportGroups
checkstyle.configProperties.staticImportGroups = starsectorImportGroups

// Which of the game's type names a compiled mod may carry, as far as this is a
// fact about the game rather than about any one mod.
//
// The game ships a build per platform and its obfuscator hands out fresh names
// in each: the same class at the same game version is com.fs.starfarer.coreui.A.G
// on one and A.H on another. A call compiled against one of those carries that
// spelling in its own descriptor, so it links on the platform it was built on
// and throws NoSuchMethodError on the next - at the call, on whichever screen
// first reaches it, with nothing said at compile time or at load.
//
// The two values below are the whole of what every mod would otherwise restate.
// A mod declares what it is allowed to name out of that namespace itself, in its
// own gradle/referenced-types.gradle, because which of the game's internals a
// project reaches for is a statement about that project: KMLib owns the by-name
// walk into the live widget tree, and a mod naming a second such type is
// reaching past that seam. Here for the reason the import groups are: every name
// in them is the game's, and the generic tier knows no game.
ext.gameNamespace = 'com.fs'

// The published API. Names in it are the game's contract with mods, kept across
// builds and platforms alike, which is the whole of what makes them safe to
// name. Everything else in the namespace is reached by method name at runtime,
// or declared one type at a time by the mod that reaches it.
ext.publishedGameApiPackages = ['com.fs.starfarer.api']

// Mod metadata is the single source of truth for the artifact version, so
// the jar name and Starsector's mod listing cannot drift.
def modInfoFile = file('mod_info.json')
def modInfo = new JsonSlurper().parse(modInfoFile)

if (!modInfo.version) {
    throw new GradleException("Missing version in ${modInfoFile}")
}

version = modInfo.version

// Captured as a local so the compile guard below closes over the file rather
// than re-reading a dynamic project property while a task runs.
def apiJarFile = project.ext.apiJarFile

// The game jars every KM mod is built against, whatever it does:
//
// - starfarer.api.jar is the published API itself.
// - lwjgl_util.jar carries Vector2f / Vector3f, which appear in Misc's
//   getDistance overloads; javac needs the class file to resolve overload
//   candidates even in a mod that names no LWJGL type itself.
// - lwjgl.jar carries org.lwjgl.opengl.GL11, the raw OpenGL surface a mod
//   drawing on the campaign or combat view goes through.
// - log4j backs Global.getLogger(...), the logging channel every mod uses.
//
// One collection rather than four declarations per configuration: a mod is held
// to all of them together, so there is no case for adding one and not the rest.
def sharedGameJars = files(
    apiJarFile,
    resolveCoreJarFile('lwjgl_util.jar'),
    resolveCoreJarFile('lwjgl.jar'),
    resolveCoreJarFile('log4j-1.2.9.jar'))

// Where a jar lands, by what supplies it at runtime. Named so a mod adding a
// dependency picks one of two documented answers instead of copying three lines
// and forgetting the fourth - and so the rule itself lives in one place.
//
// A jar from the game's own install is on both compile classpaths and off the
// test runtime, which already reaches every core jar through starsectorCoreJars
// below; adding it again would only put a second copy of the same file there.
ext.dependOnGameJars = { Object jars ->
    ['compileOnly', 'testCompileOnly'].each { configurationName ->
        dependencies.add(configurationName, jars)
    }
}

// A mod's jar lives outside the game's install and nothing else puts it on the
// test runtime, so it is added there as well as to both compile classpaths -
// which is what lets a test load a class naming one of that mod's types.
ext.dependOnModJars = { Object jars ->
    ['compileOnly', 'testCompileOnly', 'testRuntimeOnly'].each { configurationName ->
        dependencies.add(configurationName, jars)
    }
}

dependOnGameJars(sharedGameJars)

dependencies {
    // The API jar alone is raised to the test runtime: a test loading a game
    // class needs it before the core-jar set below is even consulted.
    testRuntimeOnly files(apiJarFile)
    testRuntimeOnly project.ext.starsectorCoreJars
}

// A mod publishing test fixtures builds them against the same game jars its own
// tests compile against: a fixture poses vanilla types, so without these it can
// only pose the mod's own. Guarded on the plugin, since a mod with nothing to
// share declares no fixtures source set and those configurations do not exist.
plugins.withId('java-test-fixtures') {
    dependencies {
        testFixturesCompileOnly sharedGameJars
    }
}

tasks.withType(JavaCompile).configureEach {
    doFirst {
        if (!apiJarFile.exists()) {
            throw new GradleException(
                "Could not find starfarer.api.jar at ${apiJarFile}. " +
                "Set STARSECTOR_HOME or pass -PstarsectorRoot=<path>.")
        }
    }
}

// Starsector picks up jars listed in mod_info.json's "jars" array from this
// folder, so the build output goes straight where the launcher (and mods
// that depend on this one) expect to find it.
jar {
    archiveFileName = "${project.name}.jar"
    destinationDirectory = file("$projectDir/jars")
}

// The game's own JSON parser, and the reader built on it, which the task scripts
// read a mod's shipped JSON with, so a file parses at build time exactly as the game
// parses it.
ext.gameJsonJarFile = resolveCoreJarFile('json.jar')
apply from: new File(buildscript.sourceFile.parentFile, 'shipped-json-reader.gradle')

// Per-concern task scripts, each self-contained enough to read on its own: the
// manifest-pair report a consumer gets warned by, the local fill of its
// VersionChecker template (registered only for a mod that commits one), and the
// write of one locale's bundle (registered only for a mod that commits a
// localisation manifest). Kept out of this file so it stays what its header claims -
// classpath, version source and jar location.
def starsectorTasksDir = new File(buildscript.sourceFile.parentFile, 'tasks')
apply from: new File(starsectorTasksDir, 'checks/report-kmlib-version-mismatch.gradle')
apply from: new File(starsectorTasksDir, 'release/write-version-file.gradle')
apply from: new File(starsectorTasksDir, 'generate/write-locale-files.gradle')
