// Magic-literal gate for Java sources, applied by starsector-mod.gradle into
// every mod that takes the KM conventions. Kept in its own script so the
// conventions file stays about classpath, version, and jar output while this
// owns one concern: the verification rule.
//
// The convention: "named constants good, loose literals bad" on Java (magic
// numbers). Enforced with a second Checkstyle task using a KM-owned config
// (gradle/checkstyle-magic-literals.xml), kept apart from Common-Java's
// family-wide import-hygiene config so this rule never reaches the ports we do
// not own.
//
// Scope: KM mods only. Unlike the Kotlin gate, this cannot rely on a natural
// no-op: the ports are Java and share these conventions, so without a guard
// their builds would turn red on literals we have no business fixing. The
// group guard limits enforcement to the KM family (KMLib, KMU, ...). Java test
// sources, inherently literal-heavy, are left out by scanning only src/main.
def enforceNoMagicLiteralsJava = tasks.register('enforceNoMagicLiteralsJava', Checkstyle) {
    description = 'Fails the build when a Java source uses a magic number ' +
            'instead of a named constant.'
    group = 'verification'

    def javaMainDir = file('src/main/java')
    // Resolve the shared rule config relative to THIS script, not the
    // consumer's rootDir, so it holds for KMLib and its neighbours alike.
    configFile = new File(buildscript.sourceFile.parentFile, '../../../checkstyle-magic-literals.xml')

    // Only KM mods opt in, and only when there is Java to scan. The guard is
    // what keeps the non-KM ports - which share these conventions - off the
    // rule, since a Java source set does not no-op on its own.
    onlyIf {
        javaMainDir.exists() && project.group.toString().startsWith('km')
    }
    source = fileTree(javaMainDir)
    // These rules read the source text only; no analysed-class classpath is
    // needed. The Checkstyle tool jars come from the plugin's own config.
    classpath = files()
    reports {
        xml.required = true
        html.required = false
    }
}

// Run the gate as part of the standard verification lifecycle so both a local
// 'build'/'check' and CI's 'test jar' trip it before tests execute.
tasks.matching { it.name in ['test', 'check'] }.configureEach {
    dependsOn enforceNoMagicLiteralsJava
}
