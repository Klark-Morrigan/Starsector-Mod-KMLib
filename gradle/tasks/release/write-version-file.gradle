// Fills the applying mod's committed VersionChecker template locally, so a
// checkout used as a dev install reports the version it actually holds.
//
// VersionChecker reads <mod-id>.version, and nothing commits a file under that
// name: the committed copy carries a .template suffix, because a checkout used as
// a dev install is symlinked into mods/ and a committed file under the bare name
// would hand the checker quoted tokens where it expects numbers. So something has
// to fill the template locally, and the build is that something. It runs the very
// script the release pipeline runs, so the version a dev install reports and the
// version a published zip carries cannot come out differently.
//
// Applied from the Starsector conventions rather than by a mod directly, so every
// consumer picks the task up from one place; kmlibCheckoutDirectory is the
// extension those conventions publish for locating the shared shell scripts.

import groovy.json.JsonSlurper

def modInfo = new JsonSlurper().parse(file('mod_info.json'))

def versionFileName = "${modInfo.id}.version"
def versionFileTemplateName = "${versionFileName}.template"

// Committing the template IS the opt-in to publishing update information, so it is
// also what decides whether this mod gets the local fill. Most mods applying these
// conventions publish none, and a task registered for them would declare a
// template they do not have as a task input - a build failure over a file whose
// absence is the intended state.
if (file(versionFileTemplateName).isFile()) {

    // Only the KMLib checkout holds these scripts, and every other consumer would
    // otherwise have to restate an absolute path into it.
    def actionsDirectory = new File(project.ext.kmlibCheckoutDirectory, '.github/actions')
    def fillVersionFileScript = new File(actionsDirectory,
        'fill-version-file-template/scripts/fill_version_file_template.sh')

    // Sourced by the script above for the shared mod_info.json helpers, so it is as
    // much an input as the script is: undeclared, an edit to the helpers would leave
    // the task up to date over a file the new code writes differently.
    def modInfoLibraryScript = new File(actionsDirectory, '_lib/mod_info.sh')

    // Forward slashes because this one is handed to bash, which reads a Windows
    // backslash as an escape. The input declarations below take the File as it is.
    def fillVersionFileScriptPath = fillVersionFileScript.absolutePath.replace('\\', '/')

    // Two things the generated file's download URL is built from - the release
    // zip's name and the publishing <owner>/<repo> - are derived by the script
    // rather than restated here: it derives the zip name from mod_info.json's
    // jars[0] when given none, and reads the repository from the checkout's own
    // origin remote when GITHUB_REPOSITORY is absent, which outside Actions it
    // always is. Both rules therefore have one implementation, under bats, rather
    // than a shell copy for releases and a Groovy copy for local builds that agree
    // until one of them changes.
    //
    // The remote is still read here, unparsed, to be declared as a task input
    // below: the URL is baked into the generated file, so a re-pointed clone has
    // to regenerate rather than keep one aimed at the repository it used to push
    // to. Reading it is not the same as knowing how to read a repository out of it.
    def originRemoteUrl = providers.exec {
        commandLine 'git', 'remote', 'get-url', 'origin'
        workingDir projectDir
    }.standardOutput.asText

    // The script is bash, and on Windows the shell that both exists on a
    // development machine and sees the same filesystem as the checkout is Git's.
    // Located from git itself rather than by asking PATH for 'bash', which on a
    // machine with WSL installed resolves to the WSL launcher, whose paths are not
    // these. Resolved when the task runs rather than while the build configures,
    // so a machine without Git Bash still runs every other task.
    def resolveBashExecutablePath = {

        if (!System.getProperty('os.name').toLowerCase().startsWith('windows')) {
            return 'bash'
        }

        def bashRelativePaths = ['bin/bash.exe', 'usr/bin/bash.exe']

        def gitExecutable = (System.getenv('PATH') ?: '')
            .split(File.pathSeparator)
            .collect { pathEntry -> new File(pathEntry, 'git.exe') }
            .find { candidate -> candidate.isFile() }

        if (gitExecutable == null) {
            throw new GradleException("Cannot generate ${versionFileName}: no git.exe on PATH to "
                + 'locate Git Bash from. Install Git for Windows, or run '
                + "${fillVersionFileScriptPath} under a bash of your own.")
        }

        // Which directory under the install PATH offers git from varies - <git>/cmd
        // on a plain Windows shell, <git>/mingw64/bin under Git Bash itself - so the
        // shell is searched for by walking up from wherever git was found rather
        // than by assuming a fixed hop count. Both bash locations the installer lays
        // down are tried at each level.
        def searchDirectory = gitExecutable.parentFile
        def bashExecutable = null

        while (searchDirectory != null && bashExecutable == null) {

            bashExecutable = bashRelativePaths
                .collect { relativePath -> new File(searchDirectory, relativePath) }
                .find { candidate -> candidate.isFile() }

            searchDirectory = searchDirectory.parentFile
        }
        if (bashExecutable == null) {
            throw new GradleException("Cannot generate ${versionFileName}: found git at "
                + "${gitExecutable} but no ${bashRelativePaths.join(' or ')} above it, so this "
                + 'Git ships no bash.')
        }
        return bashExecutable.absolutePath
    }

    def writeVersionFileTask = tasks.register('writeVersionFile', Exec) {

        group = 'build'

        // Parenthesised because without them the assignment is a complete statement
        // at the end of its line, and the next line's leading '+' becomes unary plus
        // on a String.
        description = ("Fills ${versionFileName} from ${versionFileTemplateName}, so a checkout "
            + 'used as a dev install reports its version to VersionChecker.')

        // The script reads mod_info.json and the template from its mod-root
        // argument, which defaults to the working directory, and resolves the output
        // path from where the caller stands. Standing in the project directory is
        // what makes the plain names below - no mod-root argument, an output path of
        // one filename - land on the consumer's own checkout.
        workingDir projectDir

        inputs.file "${projectDir}/mod_info.json"
        inputs.file "${projectDir}/${versionFileTemplateName}"
        inputs.file fillVersionFileScript
        inputs.file modInfoLibraryScript

        inputs.property 'originRemoteUrl', originRemoteUrl
        outputs.file "${projectDir}/${versionFileName}"

        // Set here rather than at configuration time so locating Git Bash - which
        // can fail - happens only for a build that actually generates the file.
        doFirst {
            commandLine resolveBashExecutablePath(),
                fillVersionFileScriptPath,
                versionFileName
        }
    }

    // Hung off jar rather than off the assemble lifecycle above it, because
    // refreshing a dev install is what `gradlew jar` IS: a checkout symlinked into
    // mods/ picks up the new jar the moment that task writes it, and a version file
    // left behind then reports the version the install no longer has - the very
    // disagreement generating it locally exists to prevent. assemble would be the
    // tidier owner of "produce what this project ships" and reach neither of the two
    // commands that actually refresh an install.
    //
    // It puts the task on the release runner too, since packaging runs `gradlew jar`
    // there. Harmless: that runner already has the bash and jq the release's own
    // version-file step needs, and the dist payload is assembled from named files,
    // so a generated file at the checkout root cannot reach the zip. The release's
    // copies come from the action, as before.
    tasks.named('jar') {
        dependsOn writeVersionFileTask
    }
}
