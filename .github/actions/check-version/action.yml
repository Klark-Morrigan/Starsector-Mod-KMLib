# Reads mod_info.json's version and reports whether the caller's checkout
# already carries a tag naming it, which is what decides whether the release
# pipeline should proceed.
#
# The caller must check out with full history and tags: the answer is read
# from the tag refs, and a shallow checkout carries too few of them to tell
# a released version from an unreleased one.
#
# Delegates to scripts/check_version.sh so the logic is unit-tested with
# bats. Composite actions themselves are not unit-testable.
name: Check version
description: >-
  Reads the version from mod_info.json and looks for a git tag naming it in
  the caller checkout. Emits the version and a flag indicating whether that
  version is still untagged (i.e. needs releasing).

outputs:
  version:
    description: "Mod version from mod_info.json (.version)."
    value: ${{ steps.check.outputs.version }}
  version-updated:
    description: >-
      "true" when no git tag names mod_info.json's version, "false" when one
      already does. Drives whether the release pipeline runs.
    # The script writes the underscored name (version_updated) to keep its
    # bats tests stable. The action surfaces the conventional hyphenated
    # name to consumers.
    value: ${{ steps.check.outputs.version_updated }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      # GITHUB_ACTION_PATH points at this action's directory regardless
      # of the caller's working directory, so the script path is stable.
      run: "$GITHUB_ACTION_PATH/scripts/check_version.sh"
