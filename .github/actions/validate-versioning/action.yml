# Enforces the versioning policy defined in docs/dev/versioning.md at
# release time. mod-release.yml invokes this before any artifact is built,
# so a drift between CHANGELOG.md, mod_info.json, and the version being
# released stops the pipeline with a clear message instead of producing a
# silently-wrong release.
#
# Delegates to scripts/validate_versioning.sh so the logic is unit-tested
# with bats. Composite actions themselves are not unit-testable.
name: Validate versioning
description: >-
  Validates the caller checkout against KMLib's versioning policy: the
  CHANGELOG section for the released version must exist, mod_info.json's
  .version must equal the released version, and that version and any kmlib
  dependency pin must be well-formed SemVer (MAJOR.MINOR.PATCH).

inputs:
  version:
    description: >-
      The version about to be released. Supplied by mod-release.yml from
      the read-mod-info action's output so the two are always in sync.
    required: true

runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      # Passed as an environment variable rather than interpolated into the
      # run body: this action runs against a consumer repo's mod_info.json,
      # and a value expanded into the command itself would be that repo's
      # chance to run shell on the runner.
      env:
        VERSION: ${{ inputs.version }}
      # GITHUB_ACTION_PATH points at this action's directory regardless
      # of the caller's working directory, so the script path is stable.
      run: |
        "$GITHUB_ACTION_PATH/scripts/validate_versioning.sh" "${VERSION}"
