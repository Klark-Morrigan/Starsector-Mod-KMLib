# Extracts a single version's section from the caller checkout's
# CHANGELOG.md into release-notes.md so mod-release.yml can attach it to
# the GitHub release body.
#
# Delegates to scripts/extract_changelog.sh so the logic is unit-tested
# with bats. Composite actions themselves are not unit-testable.
name: Extract changelog
description: >-
  Reads CHANGELOG.md from the caller checkout and writes the section for
  the supplied version to release-notes.md in the same directory. Fails
  if the section is missing rather than producing an empty release body.

inputs:
  version:
    description: >-
      The version whose changelog section should be extracted. Must match
      a "## [<version>]" heading in CHANGELOG.md exactly.
    required: true

outputs:
  notes-file:
    description: >-
      Path (relative to the caller checkout) of the generated release
      notes file. Consumers pass this to the release-creation step.
    value: ${{ steps.extract.outputs.notes-file }}

runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      # GITHUB_ACTION_PATH points at this action's directory regardless
      # of the caller's working directory, so the script path is stable.
      run: |
        "$GITHUB_ACTION_PATH/scripts/extract_changelog.sh" "${{ inputs.version }}"
        echo "notes-file=release-notes.md" >> "$GITHUB_OUTPUT"
