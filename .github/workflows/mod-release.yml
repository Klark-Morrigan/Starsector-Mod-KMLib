# Reusable release pipeline for a Starsector mod built on KMLib's shared
# Gradle conventions (gradle/starsector-mod.gradle) and laid out the way this
# repo's actions expect: mod_info.json at the root, a CHANGELOG.md section per
# released version, and a self-hosted runner labelled <mod-id>-runner.
#
# A consumer mod ships a one-line release.yml that triggers on push to its
# default branch and delegates here:
#
#   jobs:
#     release:
#       uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/workflows/mod-release.yml@<tag>
#       permissions:
#         contents: write
#       secrets: inherit
#
# All mod-specific values (id, version, runner label, zip name, jar path, and
# the repos to clone beside the checkout) are derived inside this workflow from
# the consumer's mod_info.json via the read-mod-info composite action - callers
# pass nothing. That action documents each value it emits and how it derives it.
#
# The pipeline only does real work when mod_info.json's version differs from
# the latest git tag, so an ordinary push (no version bump) costs one cheap
# config job and stops.
#
# Job chain (each downstream job is gated on version-updated == true):
#   config -> {ci-bash, ci-gradle} -> prepare-artifact -> create-tag -> create-release
name: mod-release

on:
  workflow_call:
    # No inputs: every variable is derived from the consumer's mod_info.json.
    # secrets: inherit is documented for callers but not required here - the
    # nested gates fall back to github.token when a secret is absent.
    secrets:
      sibling_checkout_token:
        description: >
          Optional token forwarded to the Gradle gate for cloning private
          sibling repos. Absent for mods whose build needs no neighbours.
        required: false

# The release publishes a tag and a GitHub release, so it needs write access
# to repository contents. A reusable workflow's permissions are capped by the
# caller, so the consumer's release.yml must also grant contents: write.
permissions:
  contents: write

jobs:
  # Single cheap gate: derive every mod-specific value, decide whether a
  # release is due, and enforce the versioning policy before anything is
  # built. Runs on a hosted runner because reading mod_info.json and the
  # changelog needs only jq + git, never the Starsector binaries.
  config:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      version-updated: ${{ steps.check.outputs.version-updated }}
      mod-id: ${{ steps.read.outputs.mod-id }}
      # Folder the mod ships as (KMU, KMLib), which is not the mod id - see
      # the read-mod-info action for why the jar name is what names it.
      mod-folder-name: ${{ steps.read.outputs.mod-folder-name }}
      dist-dir: ${{ steps.read.outputs.dist-dir }}
      zip-name: ${{ steps.read.outputs.zip-name }}
      # <mod-id>.version, named once here because four steps across two jobs
      # refer to it: the file generated into the payload, the one generated
      # for the release, the artifact carrying it between the jobs, and the
      # asset attached to the release.
      version-file-name: ${{ steps.read.outputs.version-file-name }}
      jar-source: ${{ steps.read.outputs.jar-source }}
      # JSON label set for self-hosted jobs: a mod builds on its own runner
      # (<mod-id>-runner) which carries STARSECTOR_HOME and the install.
      runner-json: ${{ steps.runner.outputs.json }}
      # Repos the mod's Gradle build applies shared scripts from by relative
      # path, so they must be cloned beside its checkout - see the build jobs.
      sibling-checkouts: ${{ steps.read.outputs.sibling-checkouts }}
      # Which KMLib this mod pins and where that release lives. Both are
      # empty for KMLib's own release, which pins no KMLib; create-release
      # reads that emptiness as "add no dependency line to the body".
      kmlib-dependency-version: ${{ steps.read.outputs.kmlib-dependency-version }}
      kmlib-release-url: ${{ steps.kmlib-release.outputs.release-url }}
    steps:
      # Default checkout pulls the CONSUMER repo (the one that triggered the
      # release), so mod_info.json and CHANGELOG.md below are the consumer's.
      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-tags: true

      # KMLib's composite actions live in this workflow's home repo, not in the
      # consumer checkout, so a local ./ ref would not resolve. They are named
      # in registry form instead, which the runner resolves without a checkout
      # of its own - the same way the cleanup step in prepare-artifact reaches
      # Common-Automation. That form takes no token, so it requires this repo
      # to be public (or shared for Actions use) by the time a release runs.
      #
      # Known tradeoff, unchanged by the form: the action LOGIC tracks KMLib
      # master while the workflow CONTRACT is pinned by the caller's @tag.
      # Acceptable - the actions are stable bash + jq; tighten to the workflow
      # ref later if reproducibility of the scripts themselves ever matters.
      - name: Derive mod values from mod_info.json
        id: read
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/read-mod-info@master

      - name: Compose self-hosted runner label set
        id: runner
        # read-mod-info emits the single label <mod-id>-runner; self-hosted
        # jobs want the conventional [self-hosted, <label>] set as JSON so
        # downstream fromJSON() decodes it into a runs-on array.
        run: |
          echo 'json=["self-hosted","${{ steps.read.outputs.runner-label }}"]' \
            >> "$GITHUB_OUTPUT"

      - name: Compare version to latest tag
        id: check
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/check-version@master

      # Enforce the versioning policy only when a release is actually due:
      # changelog section present, mod_info version matches, kmlib pin (if
      # any) well-formed. A violation fails config and blocks every
      # downstream job, so a drifted release can never publish.
      - name: Validate versioning policy
        if: steps.check.outputs.version-updated == 'true'
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/validate-versioning@master
        with:
          version: ${{ steps.check.outputs.version }}

      # The game refuses to load a mod whose declared dependency version is
      # not installed, and a player installs KMLib from its release page - so
      # a pin naming a KMLib that was never released ships a mod nobody can
      # run. Checked here, in the same cheap gate as the rules above, because
      # the answer costs one API call and a failure should cost no build.
      #
      # After validate-versioning deliberately: that step rules on the pin's
      # SHAPE, and asking the API about a malformed version would report it
      # as an absent release - the true problem named as the wrong one.
      #
      # Skipped when the mod pins no KMLib, which is KMLib releasing itself.
      # The step's own outputs then go empty, which is what the release body
      # keys off later.
      - name: Check the pinned KMLib release exists
        id: kmlib-release
        if: >-
          steps.check.outputs.version-updated == 'true'
          && steps.read.outputs.kmlib-dependency-version != ''
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/check-dependency-release@master
        with:
          repo: ${{ steps.read.outputs.kmlib-repo }}
          version: ${{ steps.read.outputs.kmlib-dependency-version }}

  # Re-run the same PR gates before publishing. The merge that triggered this
  # push already passed them, but re-gating the exact commit being released
  # guards against a dirty master and keeps the release honest.
  ci-bash:
    needs: config
    if: needs.config.outputs.version-updated == 'true'
    uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-bash.yml@master

  ci-gradle:
    needs: config
    if: needs.config.outputs.version-updated == 'true'
    uses: Klark-Morrigan/Common-Java/.github/workflows/_ci-gradle.yml@master
    with:
      # Build on the mod's own runner: it carries STARSECTOR_HOME and the
      # install that starfarer.api.jar resolves against, which a hosted
      # runner lacks. setup-java is off because that runner provides the JDK.
      runner: ${{ needs.config.outputs.runner-json }}
      gradle-tasks: coverage
      setup-java: false
      # The build applies shared Gradle scripts from neighbouring repos by
      # paths relative to its own root, so the checkout cannot sit at the
      # workspace root: it goes one level down with the neighbours cloned
      # beside it. The directory name is free - the siblings only need
      # somewhere to sit next to - so the already-derived mod id is used
      # rather than introducing another value that could drift.
      checkout-path: ${{ needs.config.outputs.mod-id }}
      working-directory: ${{ needs.config.outputs.mod-id }}
      sibling-checkouts: ${{ needs.config.outputs.sibling-checkouts }}
    secrets: inherit

  # Assemble the runtime payload and zip it. Runs on the mod's runner so the
  # jar rebuild has the Starsector install on hand. Uses the same one-level-down
  # layout as ci-gradle above, for the same reason: the build reads shared
  # Gradle scripts from repos that have to sit beside the checkout.
  prepare-artifact:
    needs: [config, ci-bash, ci-gradle]
    if: needs.config.outputs.version-updated == 'true'
    runs-on: ${{ fromJSON(needs.config.outputs.runner-json) }}
    steps:
      # Ahead of the checkout, for the same reason _ci-gradle cleans first:
      # this job runs on the mod's own persistent runner and checks out one
      # level down, so the sibling clones from the previous release attempt
      # are still sitting beside it and would fail the clone step below.
      - name: Clean the runner workspace
        if: runner.environment == 'self-hosted'
        uses: Klark-Morrigan/Common-Automation/.github/actions/clean-workspace@master

      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: ${{ needs.config.outputs.mod-id }}

      # Mirrors the clone step inside Common-Java's _ci-gradle and consumes the
      # identical { repo, path } shape, so both build jobs see one workspace
      # layout. It is a second copy of that loop, so a change to the clone
      # contract has to land in both places.
      # TODO: extract into a shared composite - a registry-form `uses:` needs
      # no checkout to resolve, as the cleanup step above demonstrates.
      - name: Check out sibling repos
        env:
          # Assigned to env (not interpolated into the script body) so the
          # JSON cannot break out of the shell command.
          SIBLINGS: ${{ needs.config.outputs.sibling-checkouts }}
          GH_TOKEN: ${{ secrets.sibling_checkout_token || github.token }}
        run: |
          set -euo pipefail
          echo "$SIBLINGS" | jq -c '.[]' | while read -r entry; do
            repo=$(jq -rn --argjson e "$entry" '$e.repo')
            path=$(jq -rn --argjson e "$entry" '$e.path')
            echo "::group::clone ${repo} -> ${path}"
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "${path}"
            echo "::endgroup::"
          done

      - name: Set up Java 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Make Gradle wrapper executable
        working-directory: ${{ needs.config.outputs.mod-id }}
        run: chmod +x gradlew

      # Tests already passed in ci-gradle; rebuild only the jar for packaging.
      - name: Build jar
        working-directory: ${{ needs.config.outputs.mod-id }}
        run: ./gradlew jar --no-daemon --console=plain

      # Copy only the runtime payload into the dist folder - no source, tests,
      # docs/dev, build caches, or Gradle wrapper. Asset dirs are copied when
      # present, so a jar-only utility (KMLib) and an asset-bearing content
      # mod share one generic step. The folder is the one read-mod-info
      # derived, so what a player unzips carries the name a build compiling
      # against this mod expects to find it under.
      - name: Assemble dist payload
        working-directory: ${{ needs.config.outputs.mod-id }}
        env:
          DIST: ${{ needs.config.outputs.dist-dir }}
          JAR_SOURCE: ${{ needs.config.outputs.jar-source }}
        run: |
          set -euo pipefail
          mkdir -p "${DIST}/jars"
          cp mod_info.json "${DIST}/"
          for f in README.md CHANGELOG.md LICENSE; do
            [ -f "${f}" ] && cp "${f}" "${DIST}/"
          done
          for d in data graphics sounds; do
            [ -d "${d}" ] && cp -r "${d}" "${DIST}/"
          done
          cp "${JAR_SOURCE}" "${DIST}/jars/"

      # The steps below run from the workspace root, where the mod sits one
      # level down, so the path into its dist folder is three derived values
      # deep. Composed here rather than inline so the `with:` blocks stay
      # readable, matching how the config job composes its runner label set.
      - name: Compose the dist path for the version file
        id: version-file
        env:
          MOD_ID: ${{ needs.config.outputs.mod-id }}
          DIST: ${{ needs.config.outputs.dist-dir }}
          VERSION_FILE: ${{ needs.config.outputs.version-file-name }}
        run: |
          set -euo pipefail
          # dist-dir is emitted with a trailing slash, trimmed here so the
          # path reads as one in the log rather than carrying an empty segment.
          echo "dist-path=${MOD_ID}/${DIST%/}/${VERSION_FILE}" >> "$GITHUB_OUTPUT"

      # Written at the workspace root, which is where the release asset is
      # uploaded from. That copy is what makes the template's masterVersionFile
      # URL (releases/latest/download/<mod-id>.version) resolve: an update
      # checker polls it without downloading the mod, so a copy sealed inside
      # the zip cannot serve it.
      - name: Write the VersionChecker file
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/fill-version-file-template@master
        with:
          mod-root: ${{ needs.config.outputs.mod-id }}
          output-path: ${{ needs.config.outputs.version-file-name }}
          zip-name: ${{ needs.config.outputs.zip-name }}

      # The player's copy, found beside mod_info.json after unzipping, which
      # VersionChecker reads to learn what version is installed. Copied rather
      # than generated a second time because the two are the same file by
      # definition - generating twice states that only as long as both calls
      # keep being given the same inputs. It has to land before the zip step.
      - name: Copy the VersionChecker file into the dist payload
        env:
          VERSION_FILE: ${{ needs.config.outputs.version-file-name }}
          DIST_PATH: ${{ steps.version-file.outputs.dist-path }}
        run: |
          set -euo pipefail
          cp "${VERSION_FILE}" "${DIST_PATH}"

      - name: Create release zip
        working-directory: ${{ needs.config.outputs.mod-id }}
        env:
          MOD_FOLDER_NAME: ${{ needs.config.outputs.mod-folder-name }}
          ZIP_NAME: ${{ needs.config.outputs.zip-name }}
        run: |
          set -euo pipefail
          cd dist
          zip -r "../${ZIP_NAME}" "${MOD_FOLDER_NAME}/"

      # The zip lands inside the checkout, one level down from the workspace,
      # so the upload path carries that prefix; the artifact NAME stays bare
      # because create-release downloads it by name into its own workspace root.
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ needs.config.outputs.zip-name }}
          path: ${{ needs.config.outputs.mod-id }}/${{ needs.config.outputs.zip-name }}
          if-no-files-found: error

      # A second artifact rather than a second path on the one above, because
      # create-release attaches these as two separate release assets and an
      # artifact is downloaded whole. This one was written at the workspace
      # root, so unlike the zip its path carries no checkout prefix.
      - name: Upload version file artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ needs.config.outputs.version-file-name }}
          path: ${{ needs.config.outputs.version-file-name }}
          if-no-files-found: error

  # Tag the released commit. Separate from create-release so the tag exists
  # before the GitHub release references it.
  create-tag:
    needs: [config, prepare-artifact]
    if: needs.config.outputs.version-updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Push version tag
        env:
          VERSION: ${{ needs.config.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

  create-release:
    needs: [config, prepare-artifact, create-tag]
    if: needs.config.outputs.version-updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The changelog-to-release tail (extract the version's section, fail on a
      # missing section, attach assets) is stack-agnostic, so it lives in
      # Common-Automation rather than being re-implemented per mod. Sparse-
      # checkout both the actions and the lib/ that create-github-release
      # sources (changelog.sh).
      - name: Check out Common-Automation actions
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: Klark-Morrigan/Common-Automation
          ref: master
          path: .common-automation
          sparse-checkout: |
            .github/actions
            .github/lib
          sparse-checkout-cone-mode: false

      - name: Download release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.config.outputs.zip-name }}

      # Into its own directory, not the workspace root: the checkout above
      # already has a <mod-id>.version there - the committed template - and
      # the generated file must not land on top of it. gh names an asset
      # after its basename, so the prefix does not reach the release.
      - name: Download version file artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ${{ needs.config.outputs.version-file-name }}
          path: version-file

      # A player reading the release has to install the pinned KMLib to run
      # the mod at all - the game refuses to load it otherwise - so the body
      # names that version and links the release it comes from. The link is
      # the URL config verified, not one built from the tag here, so it
      # cannot point at a release nothing confirmed exists.
      #
      # Composed in its own step rather than inline in the `with:` block
      # below, matching how prepare-artifact composes its dist path: markdown
      # carrying two interpolations does not read as a workflow expression.
      #
      # Both values are empty for KMLib's own release, which pins no KMLib,
      # and the suffix then stays empty - create-github-release treats that
      # as absent and publishes the changelog section alone. Guarded on the
      # URL as well as the version so a version without one omits the line
      # rather than publishing "[KMLib 1.0.0]()"; config's gating means that
      # cannot arise today, but a link is the half a reader would trust.
      - name: Compose the dependency line for the release body
        id: notes-suffix
        env:
          KMLIB_VERSION: ${{ needs.config.outputs.kmlib-dependency-version }}
          KMLIB_RELEASE_URL: ${{ needs.config.outputs.kmlib-release-url }}
        run: |
          set -euo pipefail
          suffix=""
          if [[ -n "${KMLIB_VERSION}" ]] && [[ -n "${KMLIB_RELEASE_URL}" ]]; then
            suffix="Requires [KMLib ${KMLIB_VERSION}](${KMLIB_RELEASE_URL})."
          fi
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"

      # Cut the release with the body taken from the matching CHANGELOG.md
      # section and two assets: the built mod zip (the mod's actual
      # distribution channel) and the generated .version file that update
      # checkers poll. The action fails on a missing section, so the body is
      # never silently empty - also enforced earlier by validate-versioning,
      # but this is the step that consumes it.
      - name: Create GitHub release from changelog
        uses: ./.common-automation/.github/actions/create-github-release
        with:
          version: ${{ needs.config.outputs.version }}
          notes-suffix: ${{ steps.notes-suffix.outputs.suffix }}
          files: |
            ${{ needs.config.outputs.zip-name }}
            version-file/${{ needs.config.outputs.version-file-name }}
