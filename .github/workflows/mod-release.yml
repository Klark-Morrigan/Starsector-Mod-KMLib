# Reusable release pipeline for a Starsector mod built on KMLib's shared
# Gradle conventions (gradle/starsector-mod.gradle) and laid out the way this
# repo's actions expect: the mod's metadata at the root (mod_info.base.json
# for a mod keeping locales, else mod_info.json), a CHANGELOG.md section per
# released version, and a self-hosted runner labelled <mod-id>-runner.
#
# A consumer mod ships a one-line release.yml that triggers on push to its
# default branch and delegates here:
#
#   jobs:
#     release:
#       uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/workflows/mod-release.yml@<tag>
#       permissions:
#         contents: write
#       secrets: inherit
#
# All mod-specific values (id, version, runner label, jar path, and the repos
# to clone beside the checkout) are derived inside this workflow from the
# consumer's metadata via the read-mod-info composite action, and the locales
# it releases in from its localisation/manifest.json via read-locales - callers
# pass nothing. Those actions document each value they emit and how they
# derive it.
#
# A mod committing a localisation manifest releases one zip per locale, each
# suffixed with its tag; a mod committing none releases the one unsuffixed zip.
#
# The pipeline only does real work when the metadata's version differs from
# the latest git tag, so an ordinary push (no version bump) costs one cheap
# config job and stops.
#
# Job chain (each downstream job is gated on version-updated == true):
#   config -> {ci-bash, ci-gradle} -> prepare-artifact -> create-tag -> create-release
name: mod-release

on:
  workflow_call:
    # No inputs: every variable is derived from the consumer's own files.
    # secrets: inherit is documented for callers but not required here - the
    # nested gates fall back to github.token when a secret is absent.
    secrets:
      sibling_checkout_token:
        description: >
          Optional token forwarded to the Gradle gate for cloning private
          sibling repos. Absent for mods whose build needs no neighbours.
        required: false

# The release publishes a tag and a GitHub release, so it needs write access
# to repository contents. A reusable workflow's permissions are capped by the
# caller, so the consumer's release.yml must also grant contents: write.
permissions:
  contents: write

# The directory the packaging writes every release asset into, the artifact
# carrying it between the jobs, and the directory create-release unpacks it to.
# One name for all three, stated once, so the upload and the download cannot
# drift apart.
env:
  RELEASE_ASSETS: release-assets

jobs:
  # Single cheap gate: derive every mod-specific value, decide whether a
  # release is due, and enforce the versioning policy before anything is
  # built. Runs on a hosted runner because reading the metadata, the manifest
  # and the changelog needs only jq + git, never the Starsector binaries.
  config:
    runs-on: ubuntu-latest
    outputs:
      # Read from the metadata once, by the action whose job that is, and
      # handed to every step and job that needs it - the tag gate included.
      version: ${{ steps.read.outputs.version }}
      version-updated: ${{ steps.check.outputs.version-updated }}
      mod-id: ${{ steps.read.outputs.mod-id }}
      # What the release body derives each zip's name from, by the rule the
      # packaging names them by.
      jar-source: ${{ steps.read.outputs.jar-source }}
      # The locales the packaging loops over and the release body lists, and
      # the one whose version file older installs poll. Both empty for a mod
      # keeping no locales, which packages the single unsuffixed zip.
      locales: ${{ steps.locales.outputs.locales }}
      default-locale: ${{ steps.locales.outputs.default-locale }}
      # JSON label set for self-hosted jobs: a mod builds on its own runner
      # (<mod-id>-runner) which carries STARSECTOR_HOME and the install.
      runner-json: ${{ steps.runner.outputs.json }}
      # Repos the mod's Gradle build applies shared scripts from by relative
      # path, so they must be cloned beside its checkout - see the build jobs.
      sibling-checkouts: ${{ steps.read.outputs.sibling-checkouts }}
      # Which KMLib this mod pins and where that release lives. Both are
      # empty for KMLib's own release, which pins no KMLib; create-release
      # reads that emptiness as "add no dependency line to the body".
      kmlib-dependency-version: ${{ steps.read.outputs.kmlib-dependency-version }}
      kmlib-release-url: ${{ steps.kmlib-release.outputs.release-url }}
    steps:
      # Default checkout pulls the CONSUMER repo (the one that triggered the
      # release), so the metadata and CHANGELOG.md below are the consumer's.
      # Full history rather than checkout's default shallow depth of 1. The
      # gate below decides whether a release is due by asking git which tags
      # exist, and a shallow fetch brings down only tags pointing into the
      # history it downloaded - so an already-released version looks untagged
      # and every push to master reads as a version bump. fetch-tags is kept
      # alongside because the tag refs are the thing the gate reads; asking
      # for them explicitly costs nothing and does not depend on reading the
      # depth rule to know they arrive.
      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # KMLib's composite actions live in this workflow's home repo, not in the
      # consumer checkout, so a local ./ ref would not resolve. They are named
      # in registry form instead, which the runner resolves without a checkout
      # of its own - the same way the cleanup step in prepare-artifact reaches
      # Common-Automation. That form takes no token, so it requires this repo
      # to be public (or shared for Actions use) by the time a release runs.
      #
      # Known tradeoff, unchanged by the form: the action LOGIC tracks KMLib
      # master while the workflow CONTRACT is pinned by the caller's @tag.
      # Acceptable - the actions are stable bash + jq; tighten to the workflow
      # ref later if reproducibility of the scripts themselves ever matters.
      - name: Derive mod values from the mod's metadata
        id: read
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/read-mod-info@master

      - name: Compose self-hosted runner label set
        id: runner
        # read-mod-info emits the single label <mod-id>-runner; self-hosted
        # jobs want the conventional [self-hosted, <label>] set as JSON so
        # downstream fromJSON() decodes it into a runs-on array.
        run: |
          echo 'json=["self-hosted","${{ steps.read.outputs.runner-label }}"]' \
            >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/check-version@master
        with:
          version: ${{ steps.read.outputs.version }}

      # Enforce the versioning policy only when a release is actually due:
      # changelog section present, mod_info version matches, kmlib pin (if
      # any) well-formed. A violation fails config and blocks every
      # downstream job, so a drifted release can never publish.
      - name: Validate versioning policy
        if: steps.check.outputs.version-updated == 'true'
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/validate-versioning@master
        with:
          version: ${{ steps.read.outputs.version }}

      # Gated like the policy above rather than read on every push: a malformed
      # manifest has to stop a release, and has no business failing a push that
      # releases nothing.
      - name: Read the locales the mod releases in
        id: locales
        if: steps.check.outputs.version-updated == 'true'
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/read-locales@master

      # The game refuses to load a mod whose declared dependency version is
      # not installed, and a player installs KMLib from its release page - so
      # a pin naming a KMLib that was never released ships a mod nobody can
      # run. Checked here, in the same cheap gate as the rules above, because
      # the answer costs one API call and a failure should cost no build.
      #
      # After validate-versioning deliberately: that step rules on the pin's
      # SHAPE, and asking the API about a malformed version would report it
      # as an absent release - the true problem named as the wrong one.
      #
      # Skipped when the mod pins no KMLib, which is KMLib releasing itself.
      # The step's own outputs then go empty, which is what the release body
      # keys off later.
      - name: Check the pinned KMLib release exists
        id: kmlib-release
        if: >-
          steps.check.outputs.version-updated == 'true'
          && steps.read.outputs.kmlib-dependency-version != ''
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/check-dependency-release@master
        with:
          repo: ${{ steps.read.outputs.kmlib-repo }}
          version: ${{ steps.read.outputs.kmlib-dependency-version }}

  # Re-run the same PR gates before publishing. The merge that triggered this
  # push already passed them, but re-gating the exact commit being released
  # guards against a dirty master and keeps the release honest.
  ci-bash:
    needs: config
    if: needs.config.outputs.version-updated == 'true'
    uses: Klark-Morrigan/Common-Automation/.github/workflows/ci-bash.yml@master

  ci-gradle:
    needs: config
    if: needs.config.outputs.version-updated == 'true'
    uses: Klark-Morrigan/Common-Java/.github/workflows/_ci-gradle.yml@master
    with:
      # Build on the mod's own runner: it carries STARSECTOR_HOME and the
      # install that starfarer.api.jar resolves against, which a hosted
      # runner lacks. setup-java is off because that runner provides the JDK.
      runner: ${{ needs.config.outputs.runner-json }}
      gradle-tasks: coverage
      setup-java: false
      # The build applies shared Gradle scripts from neighbouring repos by
      # paths relative to its own root, so the checkout cannot sit at the
      # workspace root: it goes one level down with the neighbours cloned
      # beside it. The directory name is free - the siblings only need
      # somewhere to sit next to - so the already-derived mod id is used
      # rather than introducing another value that could drift.
      checkout-path: ${{ needs.config.outputs.mod-id }}
      working-directory: ${{ needs.config.outputs.mod-id }}
      sibling-checkouts: ${{ needs.config.outputs.sibling-checkouts }}
    secrets: inherit

  # Assemble the runtime payload and zip it. Runs on the mod's runner so the
  # jar rebuild has the Starsector install on hand. Uses the same one-level-down
  # layout as ci-gradle above, for the same reason: the build reads shared
  # Gradle scripts from repos that have to sit beside the checkout.
  prepare-artifact:
    needs: [config, ci-bash, ci-gradle]
    if: needs.config.outputs.version-updated == 'true'
    runs-on: ${{ fromJSON(needs.config.outputs.runner-json) }}
    steps:
      # Ahead of the checkout, for the same reason _ci-gradle cleans first:
      # this job runs on the mod's own persistent runner and checks out one
      # level down, so the sibling clones from the previous release attempt
      # are still sitting beside it and would fail the clone step below.
      - name: Clean the runner workspace
        if: runner.environment == 'self-hosted'
        uses: Klark-Morrigan/Common-Automation/.github/actions/clean-workspace@master

      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: ${{ needs.config.outputs.mod-id }}

      # The same action Common-Java's _ci-gradle clones its siblings with, so
      # the build job and this packaging job lay the workspace out by one
      # rule rather than by two copies of a loop that drifted.
      - name: Check out sibling repos
        uses: Klark-Morrigan/Common-Automation/.github/actions/checkout-siblings@master
        with:
          siblings: ${{ needs.config.outputs.sibling-checkouts }}
          token: ${{ secrets.sibling_checkout_token || github.token }}

      - name: Set up Java 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '17'
          distribution: temurin

      - name: Make Gradle wrapper executable
        working-directory: ${{ needs.config.outputs.mod-id }}
        run: chmod +x gradlew

      # Tests already passed in ci-gradle; rebuild only the jar for packaging.
      # Once, whatever the locale count: the jar is identical across locales,
      # which is what lets the packaging below be a loop rather than a matrix
      # rebuilding it per locale on this one runner.
      - name: Build jar
        working-directory: ${{ needs.config.outputs.mod-id }}
        run: ./gradlew jar --no-daemon --console=plain

      # Per locale: write the locale into the checkout, assemble the runtime
      # payload, fill its VersionChecker file, zip it - collecting each zip
      # and each locale's version file at the workspace root. Those version
      # files are what the template's masterVersionFile URL resolves to: an
      # update checker polls one without downloading the mod, so the copy
      # sealed inside a zip cannot serve it. For a mod keeping no locales,
      # the one unsuffixed zip and version file.
      - name: Package the release assets
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/package-release@master
        with:
          mod-root: ${{ needs.config.outputs.mod-id }}
          output-dir: ${{ env.RELEASE_ASSETS }}
          locales: ${{ needs.config.outputs.locales }}
          default-locale: ${{ needs.config.outputs.default-locale }}

      # One artifact for every asset, since create-release attaches all of
      # them and an artifact is downloaded whole.
      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_ASSETS }}
          path: ${{ env.RELEASE_ASSETS }}/
          if-no-files-found: error

  # Tag the released commit. Separate from create-release so the tag exists
  # before the GitHub release references it.
  create-tag:
    needs: [config, prepare-artifact]
    if: needs.config.outputs.version-updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Push version tag
        env:
          VERSION: ${{ needs.config.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

  create-release:
    needs: [config, prepare-artifact, create-tag]
    if: needs.config.outputs.version-updated == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out consumer repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # The changelog-to-release tail (extract the version's section, fail on a
      # missing section, attach assets) is stack-agnostic, so it lives in
      # Common-Automation rather than being re-implemented per mod. Sparse-
      # checkout both the actions and the lib/ that create-github-release
      # sources (changelog.sh).
      - name: Check out Common-Automation actions
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: Klark-Morrigan/Common-Automation
          ref: master
          path: .common-automation
          sparse-checkout: |
            .github/actions
            .github/lib
          sparse-checkout-cone-mode: false

      # Into its own directory, not the workspace root, so no asset can land on
      # a file of the checkout above. gh names an asset after its basename, so
      # the prefix does not reach the release.
      - name: Download the release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ASSETS }}
          path: ${{ env.RELEASE_ASSETS }}

      # Listed from what arrived rather than named again here, so the release
      # attaches exactly what the packaging produced - one zip and one version
      # file per locale, and the unsuffixed version file - without this job
      # restating how many locales there were or what their files are called.
      # Emitted in the multi-line form $GITHUB_OUTPUT takes, one path per line,
      # which is the shape create-github-release's files input reads.
      - name: List the release assets
        id: assets
        run: |
          set -euo pipefail
          {
            echo 'files<<RELEASE_ASSET_LIST'
            find "${RELEASE_ASSETS}" -maxdepth 1 -type f | sort
            echo 'RELEASE_ASSET_LIST'
          } >> "${GITHUB_OUTPUT}"

      # Which zip holds which language, and which language needs a core
      # localisation installed over the game to draw at all - a dependency the
      # launcher cannot see, so the release page is one of the few places a
      # player can be told. Empty for a mod keeping no locales.
      - name: Compose the locale line for the release body
        id: locale-note
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/compose-locale-note@master
        with:
          locales: ${{ needs.config.outputs.locales }}
          jar-source: ${{ needs.config.outputs.jar-source }}
          version: ${{ needs.config.outputs.version }}

      # A player reading the release has to install the pinned KMLib to run
      # the mod at all - the game refuses to load it otherwise - so the body
      # names that version and links the release it comes from. The link is
      # the URL config verified, not one built from the tag here, so it
      # cannot point at a release nothing confirmed exists.
      #
      # An action rather than an inline run block, so the copy and the
      # condition attached to it are unit-tested like every other piece of
      # logic in this pipeline. Both values are empty for KMLib's own
      # release, which pins no KMLib; the action then emits an empty note and
      # create-github-release treats that as absent, publishing the changelog
      # section alone. The short display name is stated here rather than read
      # from mod_info.json, whose dependency entry carries the long one.
      - name: Compose the dependency line for the release body
        id: dependency-note
        uses: Klark-Morrigan/Starsector-Mod-KMLib/.github/actions/compose-dependency-note@master
        with:
          dependency-name: KMLib
          version: ${{ needs.config.outputs.kmlib-dependency-version }}
          release-url: ${{ needs.config.outputs.kmlib-release-url }}

      # Cut the release with the body taken from the matching CHANGELOG.md
      # section, the two composed lines under it, and every packaged asset:
      # the zips (the mod's actual distribution channel) and the generated
      # .version files that update checkers poll. The action fails on a
      # missing section, so the body is never silently empty - also enforced
      # earlier by validate-versioning, but this is the step that consumes it.
      #
      # The lines are joined by a blank line and the whole trimmed by the
      # action, so either one resolving to empty leaves no gap behind it.
      - name: Create GitHub release from changelog
        uses: ./.common-automation/.github/actions/create-github-release
        with:
          version: ${{ needs.config.outputs.version }}
          notes-suffix: |
            ${{ steps.locale-note.outputs.note }}

            ${{ steps.dependency-note.outputs.note }}
          files: ${{ steps.assets.outputs.files }}
