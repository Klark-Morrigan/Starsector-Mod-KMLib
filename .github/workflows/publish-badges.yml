# KMLib's own download-badge entry point. Runs every 30 minutes and on demand,
# and delegates to the reusable publish-download-badges workflow this same
# repo hosts, which reads everything it needs from mod_info.base.json - so
# this caller passes no inputs.
#
# The ref is local (./) rather than @master or a tag, as in release.yml: a
# workflow calling its own repository runs it as it stands on the commit
# being run, so there is no pin to keep in step.
#
# The run holds a write token, so only the schedule and someone with write
# access can start it: no push or pull-request trigger.
name: Publish badges

on:
  # Every 30 minutes, often enough to show a new release's early adoption.
  # Off the top of the hour, where GitHub's scheduler is busiest and most
  # likely to delay or drop a run.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

# A reusable workflow's permissions are capped by its caller, so the push to
# the badges branch needs the grant repeated here. No token can be scoped to
# one branch; the repository's rulesets fence every other one.
permissions:
  contents: write

jobs:
  publish-badges:
    uses: ./.github/workflows/publish-download-badges.yml
