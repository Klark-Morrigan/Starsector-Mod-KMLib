# KMLib's own CI: keeps the bats coverage for the composite-action scripts
# green now that they live here (read-mod-info, check-version,
# extract-changelog, validate-versioning).
#
# Runs on GitHub-hosted ubuntu-latest because bats only needs Linux and jq.
# The Gradle build is intentionally NOT gated here: KMLib's build depends
# on starfarer.api.jar from a Starsector install (see build.gradle), and
# the hosted runner has no Starsector binaries. Gradle gating belongs on a
# self-hosted runner with STARSECTOR_HOME configured.
#
# workflow_call is exposed so a future caller (e.g. a release workflow for
# KMLib itself) can re-run these tests without duplicating the steps.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  bats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # ubuntu-latest ships jq, but installing explicitly keeps the job
      # robust against future image changes.
      - name: Install bats and jq
        run: sudo apt-get update && sudo apt-get install -y bats jq

      - name: Run shell script tests
        run: bats .github/tests/
